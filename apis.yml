apis:
- name: Worldpay Card Payments API
  description: Accept online card payments via Visa, Mastercard, American Express,
    and other card networks. Supports one-time authorizations, card-on-file, recurring
    and subscription payments, Apple Pay, Google Pay, and auto-settlement.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.worldpay.com/access/products/payments
  baseURL: https://access.worldpay.com
  tags:
  - Card Payments
  - Payment Authorization
  - Recurring Payments
  - Digital Wallets
  properties:
  - type: Documentation
    url: https://docs.worldpay.com/access/products/payments
  - type: OpenAPI
    url: https://docs.worldpay.com/access/products/payments/openapi
  - url: graphql/worldpay-graphql.md
    type: GraphQL
  contact:
  - FN: Worldpay Developer Support
    url: https://docs.worldpay.com/
    email: ''
- name: Worldpay Tokens API
  description: Tokenize and manage payment card data to minimize sensitive data exposure
    and increase security. Supports creation of tokens from card details, detokenization
    with masked output, and verified tokens that are CIT compliant.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.worldpay.com/access/apis
  baseURL: https://access.worldpay.com
  tags:
  - Tokenization
  - Card Security
  - PCI Compliance
  properties:
  - type: Documentation
    url: https://docs.worldpay.com/access/apis
  contact:
  - FN: Worldpay Developer Support
    url: https://docs.worldpay.com/
- name: Worldpay Card Payouts API
  description: Send funds directly to customer cards using Standard or Fast Access
    options, enabling push payments and disbursements to Visa and Mastercard cards.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.worldpay.com/access/apis
  baseURL: https://access.worldpay.com
  tags:
  - Payouts
  - Disbursements
  - Push Payments
  properties:
  - type: Documentation
    url: https://docs.worldpay.com/access/apis
  contact:
  - FN: Worldpay Developer Support
    url: https://docs.worldpay.com/
- name: Worldpay Account Payouts API
  description: Send funds to customer bank accounts with search capabilities for tracking.
    Supports bank transfer payouts with beneficiary account verification integration.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.worldpay.com/access/apis
  baseURL: https://access.worldpay.com
  tags:
  - Payouts
  - Bank Transfers
  - Account Management
  properties:
  - type: Documentation
    url: https://docs.worldpay.com/access/apis
  contact:
  - FN: Worldpay Developer Support
    url: https://docs.worldpay.com/
- name: Worldpay FraudSight API
  description: Standalone risk assessment API for advanced fraud prevention. Returns
    risk scores and recommendations that link with the Card Payments API via riskProfile
    to reduce chargebacks and fraudulent transactions.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.worldpay.com/access/apis
  baseURL: https://access.worldpay.com
  tags:
  - Fraud Prevention
  - Risk Assessment
  - Payments Security
  properties:
  - type: Documentation
    url: https://docs.worldpay.com/access/apis
  contact:
  - FN: Worldpay Developer Support
    url: https://docs.worldpay.com/
- name: Worldpay 3DS API
  description: Identity verification for regulatory compliance supporting 3D Secure
    authentication. Enables Strong Customer Authentication (SCA) required under PSD2
    regulations in Europe.
