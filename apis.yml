name: Worldpay
description: Worldpay is a global payment processing platform (part of FIS) offering
  REST APIs for payment acceptance, transaction management, tokenization, recurring
  billing, fraud prevention, and global acquiring services. It supports card payments,
  digital wallets, alternative payment methods, payouts, foreign exchange, and hosted
  payment pages across more than 146 countries.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/worldpay/refs/heads/main/apis.yml
version: '0.19'
created: '2026-06-13'
modified: '2026-06-13'
tags:
