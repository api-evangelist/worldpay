    channel:
      type: string
      description: 'The payment channel indicates the interaction of the cardholder with the merchant.

        Supply a value of `moto` to process an authorization as a Mail Order or Telephone Order transaction.

        When channel is not provided, the authorization will be processed as ecommerce `ecom` by default.


        **NOTE:** 3DS `authentication` data cannot be supplied for MOTO payments.

        '
      enum:
      - moto
      - ecom
    recipient:
      type: object
      description: 'The details of the recipient of the payment.


        We highly recommend you supply this, if your MCC is 6012 or 6051. Sending this field ensures you remain PSD2 compliant

        and avoid potential acquirer refusals.


        '
      properties:
        accountReference:
          type: string
          description: Partial account number.
          example: azAZ0123
        lastName:
          $ref: '#/components/schemas/lastName'
        address:
          type: object
          required:
          - postalCode
          properties:
            postalCode:
              $ref: '#/components/schemas/postalCode'
        dateOfBirth:
          type: object
          required:
          - day
          - month
          - year
          properties:
            day:
              type: number
              description: Recipient's day of birth
              example: 1
            month:
              type: number
              description: Recipient's month of birth
              example: 2
            year:
              type: number
              description: Recipient's year of birth
              example: 2000
    riskFactors:
      description: List of risks involved in this verification.
      type: array
      required:
      - risk
      - type
      items:
        type: object
        properties:
          type:
            type: string
            enum:
            - cvc
            - avs
            - nameInquiry
            example: avs
          risk:
            type: string
            enum:
            - notChecked
            - notMatched
            - notSupplied
            - partialMatched
            - notSupported
            example: notMatched
          detail:
            type: string
            enum:
            - postcode
            - address
            - firstName
            - middleName
            - lastName
            example: postcode
      example:
      - type: cvc
        risk: notSupplied
      - type: avs
        detail: postcode
        risk: notSupplied
      - type: avs
        detail: address
        risk: notSupplied
    nameInquiry:
      type: string
      enum:
      - matched
      - partialMatched
      - notMatched
      - notChecked
      - notSupported
      description: Result of the Cardholder Name Inquiry
    merchant:
      type: object
      description: Information about the merchant.
      required:
      - entity
      properties:
        entity:
          type: string
          description: This should map to a profile from the Onboarding Domain. For more information contact your Relationship Manager or Worldpay Implementation Manager.
        mcc:
          type: string
          description: A Merchant Category Code (MCC) can be applied to an individual request. You can only supply `mcc`, if we have enabled the dynamic MCC feature during boarding. If enabled but not provided, `merchant.mcc` defaults to a configured value. For more information contact your Relationship Manager or Worldpay Implementation Manager.
          example: '6012'
        paymentFacilitator:
          type: object
          description: 'An object containing your payment facilitator information.


            This parameter is only required for verification if you are a payment facilitator.'
          required:
          - schemeId
          - subMerchant
          properties:
            schemeId:
              type: string
              description: ' Your payment facilitator ID received from Mastercard, Visa and Amex.'
              example: '12345678901'
            independentSalesOrganizationId:
              type: string
              description: ' Independent Sales Organization (ISO) ID provided by Mastercard.'
              example: '12345678901'
            subMerchant:
              type: object
              description: Your sub-merchant's details
              required:
              - merchantId
              - name
              - address
              - street
              - city
              - countryCode
              - postalCode
              properties:
                reference:
                  type: string
                  description: Unique merchant reference
                  example: '123456789012345'
                  pattern: ^[0-9]{1,15}$
                name:
                  type: string
                  description: The name of your subMerchant's company
                  example: Stonewall Inn
                  pattern: ^[A-Za-z0-9 ]{1,25}$
                address:
                  type: object
                  required:
                  - postalCode
                  - street
                  - city
                  - countryCode
                  properties:
                    street:
                      type: string
                      description: Street name of your subMerchant's company
                      example: 53 Christopher Street
                      pattern: ^[A-Z, a-z,0-9,\s]{1,50}$
                    state:
                      type: string
                      description: State of your subMerchant's company
                      example: NY
                      pattern: ^[A-Z]{1,3}$
                    city:
                      type: string
                      description: City of your subMerchant's company
                      example: New York City
                      pattern: ^[A-Z, a-z,\-\s]{1,13}$
                    countryCode:
                      type: string
                      description: The alpha-2 ISO-3166 country code of the billing address
                      example: GB
                      pattern: ^[A-Z]{2}$
                    postalCode:
                      type: string
                      description: Post code/Zip code of your subMerchant's company
                      example: '10014'
                taxReference:
                  type: string
                  description: Tax Reference of your subMerchant's company
                  example: 987-65-4321
                  pattern: ^[A-Za-z0-9-\s]{1,20}$
                phoneNumber:
                  type: string
                  description: Phonenumber of your subMerchant's company
                  example: 987-65-4321
                email:
                  type: string
                  description: Email address of your subMerchant's company
                  example: email@example.com
                url:
                  type: string
                  description: URL of submerchant's company
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9@!£*#$)(+-_=.,/;:]*$
    instruction:
      type: object
      required:
      - value
      - paymentInstrument
      properties:
        consumerBillPayment:
          type: boolean
          description: If you are registered with Visa as a Consumer Bill Payment Service provider, you must set this to `true` for any verifications made for the purpose of paying consumer bills in the future.
          example: true
        nominalRetry:
          type: boolean
          description: Set this field to `true` to automatically retry a failed zero value verification with a nominal value authorisation amount. This is only possible if **0** or **missing** \"value.amount\" is submitted with the verification request. We automatically cancel the applied nominal authorization amount before your customer is charged.
          example: true
        value:
          $ref: '#/components/schemas/value'
        narrative:
          description: Text to appear on the customer's billing statement. Sometimes referred to as a billing descriptor.  If this isn't set, the value from your merchant profile is used.
          required:
          - line1
          properties:
            line1:
              type: string
              example: MindPalace
              pattern: ^[A-Za-z0-9-,.'\s]{3,24}$
            line2:
              type: string
              example: Memory
              pattern: ^[A-Za-z0-9-,.'\s]{3,24}$
        paymentInstrument:
          $ref: '#/components/schemas/paymentInstrument'
        customerAgreement:
          description: Contains specific customer agreements for the transaction.
          type: object
          required:
          - type
          oneOf:
          - $ref: '#/components/schemas/cardOnFile'
          - $ref: '#/components/schemas/subscription'
          - $ref: '#/components/schemas/installment'
          - $ref: '#/components/schemas/unscheduled'
        fundsTransfer:
          description: Contains details of the funds transfer request, which is a money movement for a reason other than the purchase of goods or services (also known as Account Funding Transaction).
          type: object
          required:
          - type
          properties:
            type:
              description: Specify the type of the funds transfer.
              enum:
              - accountToAccount
              - cash
              - disbursement
              - personToPerson
              - purchase
              - topUp
              - transfer
              - walletLoad
              type: string
            purpose:
              description: Specify the purpose of the funds transfer.
              enum:
              - businessToBusiness
              - creditCardRepayment
              - crowdLending
              - crypto
              - debitCard
              - education
              - emergency
              - familySupport
              - gaming
              - gift
              - giftcard
              - highRiskSecurities
              - liquidAssets
              - medical
              - payroll
              - prepaidCard
              - salary
              - savings
              - travel
              - other
              type: string
    cardGooglepayDecrypted:
