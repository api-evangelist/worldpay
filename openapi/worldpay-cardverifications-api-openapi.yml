        description: Action link that's received in your request.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/contentTypeHeader'
      responses:
        '200':
          description: Successful query request
          headers:
            WP-CorrelationId:
