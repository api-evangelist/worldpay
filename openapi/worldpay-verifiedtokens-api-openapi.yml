          properties:
            type:
              type: string
              example: card/plain
            card:
              type: object
              properties:
                number:
                  type: object
                  required:
                  - bin
                  - last4Digits
                  properties:
                    bin:
                      type: string
                      example: '4444'
                    last4Digits:
                      type: string
                      example: '1236'
                countryCode:
                  type: string
                  example: GB
                expiryDate:
                  type: object
                  required:
                  - month
                  - year
                  properties:
                    month:
                      type: integer
                      format: int32
                      example: 1
                    year:
                      type: integer
                      format: int32
                      example: 2024
                brand:
                  type: string
                  example: visa
                fundingType:
                  type: string
                  example: credit
                issuer:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      example: UNKNOWN
                paymentAccountReference:
                  type: string
                  example: Q1HJZ28RKA1EBL470G9XYG90R5D3E
        _links:
          type: object
          required:
          - verifications:verification
          - curies
          properties:
            verifications:verification:
              type: object
              required:
              - href
              properties:
                href:
                  type: string
                  example: https://try.access.worldpay.com/verifications/accounts/Mjp1K3U0cTlvQWhPZFJxN2hQazYyaWx3PT06QUVTL0NCQy9QS0NTNVBhZGRpbmc6WjBXelE2YmQwNnlwTzRqbXk1bE9ERWZ3emlUbzMyZzlRNFE5a0NkRFV2ZlliWU5wS0FnOUpWcEJZUUIxTkp6Si9Kcy80UEVjUmlGbGcxeTE5SHhSVnJEV3JnUEtkYXk4dFVlYXF6ZDRoZ1k9
            curies:
              type: array
              items:
                type: object
                required:
                - href
                - name
                - templated
                properties:
                  href:
                    type: string
                    example: https://try.access.worldpay.com/rels/verifications/accounts/{rel}
                  name:
                    type: string
                    example: verifications
                  templated:
                    type: boolean
                    example: true
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
