                iban:
                  type: string
                  example: NL03RABO0123456789
                accountHolderName:
                  type: string
                  example: A Shopper
                swiftBic:
                  type: string
                  example: RABONL2U
                countryCode:
                  type: string
                  example: GB
            _links:
              $ref: '#/components/schemas/_links'
    authorizedPaymentIdeal:
