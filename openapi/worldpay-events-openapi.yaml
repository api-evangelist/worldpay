                accountHolderName:
                  type: string
                  example: A Shopper
                countryCode:
                  type: string
                  example: GB
            _links:
              $ref: '#/components/schemas/_links'
    authorizedPaymentMyBank:
      properties:
        eventId:
          $ref: '#/components/schemas/eventId'
        eventTimestamp:
          $ref: '#/components/schemas/eventTimestamp'
        eventDetails:
          type: object
          properties:
            classification:
              type: string
              description: >-
                The event category, this can either be payout, payment or
