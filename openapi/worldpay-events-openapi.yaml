              example: authorized
            date:
              $ref: '#/components/schemas/date'
            amount:
              $ref: '#/components/schemas/amount'
            paymentInstrument:
              type: object
              properties:
                method:
                  type: string
                  example: Open Banking
                iban:
                  type: string
                  example: NL03RABO0123456789
                accountHolderName:
                  type: string
                  example: A Shopper
                swiftBic:
                  type: string
                  example: RABONL2U
                countryCode:
                  type: string
                  example: GB
                accountNumber:
                  type: string
                  example: '04914552'
                bankCode:
                  type: string
                  example: '040004'
            _links:
              $ref: '#/components/schemas/_links'
    sentForSettlementPayment:
