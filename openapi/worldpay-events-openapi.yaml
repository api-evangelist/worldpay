              example: payment
            transactionReference:
              $ref: '#/components/schemas/transactionReference'
            type:
              type: string
              description: >-
                Event status. For example, `cancelled` or
                `sentForAuthorization`.
              example: authorized
            date:
              $ref: '#/components/schemas/date'
            amount:
              $ref: '#/components/schemas/amount'
            paymentInstrument:
              type: object
              properties:
                method:
                  type: string
