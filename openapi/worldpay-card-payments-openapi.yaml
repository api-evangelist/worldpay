components:
  schemas:
    transactionReference:
      maxLength: 64
      minLength: 1
      pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
      type: string
      description: >-
        A unique reference generated by you that is used to identify a payment
        throughout its lifecycle.
    entity:
      maxLength: 32
      minLength: 1
      pattern: ^([A-Za-z0-9]+[A-Za-z0-9 ]*)?$
      example: default
      type: string
      description: >-
        Direct your payment to assist with billing, reporting and
        reconciliation. This is mandatory for authentication and queries.
    mcc:
      pattern: ^\d{4}$
      type: string
      description: >-
        You can apply a merchant category code `mcc` to an individual request.
        You can only provide an `mcc` if we have enabled the dynamic mcc feature
        during boarding. If enabled but not provided, `merchant.mcc` defaults to
        a configured value.
      maxLength: 4
      minLength: 4
    paymentFacilitator:
      required:
        - schemeId
        - subMerchant
      type: object
      description: >-
        An object containing Payment Facilitator information. This information
        is required for every authorization **only if you are a Payment
        Facilitator**.
      properties:
        schemeId:
          maxLength: 11
          minLength: 1
          pattern: '[0-9]*$'
          type: string
          description: Your payment facilitator ID received from Visa, Mastercard, or Amex.
        independentSalesOrganizationId:
          maxLength: 11
          minLength: 1
          pattern: '[0-9]*$'
          type: string
        subMerchant:
          required:
            - reference
            - name
            - address
          type: object
          properties:
            name:
              maxLength: 25
              minLength: 1
              pattern: ^(?!\s*$)[A-Za-z0-9 ]*$
              type: string
            reference:
              type: string
              minLength: 1
              maxLength: 15
              pattern: ^[A-Za-z0-9]*$
            address:
              type: object
              required:
                - postalCode
                - street
                - city
                - countryCode
              properties:
                postalCode:
                  maxLength: 10
                  minLength: 1
                  pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
                  type: string
                  example: SW1 1AA
                street:
                  maxLength: 50
                  minLength: 1
                  pattern: ^(?!\s*$)[A-Za-z0-9\s]*$
                  type: string
                  example: 221B Baker Street
                city:
                  maxLength: 13
                  minLength: 1
                  pattern: ^(?!\s*$)[A-Za-z\s-]*$
                  type: string
                  example: London
                state:
                  maxLength: 3
                  minLength: 1
                  pattern: ^[a-zA-Z0-9]*$
                  type: string
                  description: The state code of the subMerchant in ISO-3166-2 format.
                countryCode:
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]*$
                  type: string
                  description: >-
                    Country code of the subMerchant in [ISO 3166-1 Alpha-2
                    format](/products/reference/supported-countries-currencies#iso-country-codes).
            phoneNumber:
              maxLength: 20
              minLength: 4
              pattern: ^(?!\s*$)[0-9\s()+-/.x]*$
              type: string
            taxReference:
              maxLength: 20
              minLength: 1
              pattern: ^(?!\s*$)[a-zA-Z0-9\s-]*$
              type: string
            email:
              maxLength: 40
              minLength: 1
              type: string
              pattern: ^.+@.+$
            url:
              maxLength: 255
              minLength: 1
              pattern: ^[a-zA-Z0-9@!£*#$)(+-_=.,/;:]*$
              type: string
    taxReference:
      maxLength: 20
      minLength: 1
      pattern: ^(?!\s*$)[a-zA-Z0-9\s-]*$
      type: string
      description: Merchant's tax reference.
    narrative:
      required:
        - line1
      type: object
      description: >-
        The text that appears on your customer's statement. Used to identify the
        merchant.
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 24
          pattern: ^[a-zA-Z0-9 _!@#$%()*=.:;?[]{}~/+-,`^&]*$
          description: >-
            The first line of the narrative which appears on your customer's
            statement (24 characters max. If character is not supported it is
            replaced with a space).
        line2:
          type: string
          minLength: 1
          maxLength: 24
          pattern: ^[a-zA-Z0-9 _!@#$%()*=.:;?[]{}~/+-,`^&]*$
          description: >-
            Additional details about the payment e.g. order number, telephone
            number.
    routing:
      type: object
      description: An object containing specific routing preferences.
      properties:
        fundingType:
          type: string
          description: Specifies the credit or debit functionality of a combo card.
          enum:
            - credit
            - debit
        preferredCardBrand:
          type: string
          enum:
            - visa
            - mastercard
            - maestro
            - amex
            - cartesBancaires
            - diners
            - dankort
            - jcb
            - discover
            - elo
            - eftposAU
            - unionPay
          description: >-
            Specifies your customer's preferred card brand to be used for the
            transaction using a co-badged card.
    requestAccountUpdater:
      type: boolean
      description: >-
        Allows you to request a real-time account update when using a previously
        stored card. You can only use this with `customerAgreement` transactions
        with a `storedCardUsage` value of `subsequent`. If the stored card
        details that you provided for the transaction are no longer valid and
        new credentials are available, the authorization will be processed with
        the new card and its details will be returned in the
        `updatedPaymentInstrument` object in the response.
    debtRepayment:
      type: boolean
      description: >-
        Debt Repayment Indicator is a flag which identifies a payment with the
        purpose of repaying a debt.
    consumerBillPayment:
      type: boolean
      description: >-
        Consumer Bill Payment is a flag which identifies a bill payment paid by
        providers on behalf of consumers.
    recipient:
      type: object
      description: Additional transaction recipient data.
      properties:
        accountReference:
          maxLength: 10
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            Partial account reference of the primary recipient. Either partial
            card number (first 6 and last 4, no spaces), or a bank account
            number
          example: '4444331111'
        lastName:
          maxLength: 60
          minLength: 1
          pattern: ^[a-zA-Z@!£*#$)(+-_=.,/;:'" ]*$
          type: string
          description: >-
            The last name of the recipient. If for a business, then use the
            company name.
          example: Smith
        address:
          type: object
          description: Address of the recipient.
          required:
            - postalCode
          properties:
            postalCode:
              maxLength: 7
              minLength: 5
              pattern: ^[A-Z0-9 ]*$
              type: string
              description: The postal code of the recipient (UK only)
        dateOfBirth:
          type: object
          description: Birth date of the recipient.
          required:
            - day
            - month
            - year
          properties:
            day:
              type: integer
            month:
              type: integer
            year:
              type: integer
    industryData:
      type: object
      description: An object containing industry specific order data.
      properties:
        type:
          enum:
            - airline
          type: string
        airlineName:
          type: string
          description: The name of the airline (displayed as it would be on a bill).
          example: Cobb Air
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9 @!£*#\$()\+\-_=.,\/;:'"]+$
        ticket:
          type: object
          description: An object containing ticket details.
          properties:
            number:
              type: string
              description: The ticket number.
              example: '123'
              minLength: 1
              maxLength: 16
              pattern: ^[A-Za-z0-9]+$
            issuerAddress:
              type: object
              description: An object containing the ticket issuer's address.
              properties:
                address1:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9 ]+$
                city:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[A-Za-z0-9 ]+$
                countryCode:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: ^[A-Z]{2}$
                postalCode:
                  type: string
                  minLength: 1
                  maxLength: 10
                  pattern: ^[A-Za-z0-9 ]+$
              required:
                - address1
                - city
                - countryCode
                - postalCode
            flightDetails:
              description: >-
                An array with objects containing flight details. Each object
                represents one leg of a flight and you can submit up to four
                flight legs within this array.
              items:
                type: object
                properties:
                  fareClassCode:
                    type: string
                    description: The code used by airlines to identity a fare type.
                    minLength: 1
                    maxLength: 15
                    pattern: ^[A-Za-z0-9]+$
                  departureAirport:
                    type: string
                    description: >-
                      The three letter IATA Airport Code for the departure
                      airport.
                    example: LHR
                    minLength: 3
                    maxLength: 3
                    pattern: ^[A-Z]{3}$
                  arrivalAirport:
                    type: string
                    description: >-
                      The three letter IATA Airport Code for the destination
                      airport.
                    example: SYD
                    minLength: 3
                    maxLength: 3
                    pattern: ^[A-Z]{3}$
                  carrierCode:
                    type: string
                    description: >-
                      Same as `industryData.airlineCode`, the code represents
                      the airline for the specific flight leg.
                    example: M1
                    minLength: 2
                    maxLength: 2
                    pattern: ^[A-Z]{2}$
                  fareBasisCode:
                    type: string
                    description: >-
                      An optional extension to the `fareClassCode` for custom
                      codes.
                    example: TMYA
                    minLength: 1
                    maxLength: 15
                    pattern: ^[A-Za-z0-9]+$
                  flightCode:
                    type: string
                    description: The flight code.
                    example: '501'
                    minLength: 1
                    maxLength: 5
                    pattern: ^[0-9]+$
                  departureDate:
                    type: object
                    description: An object containing the date of the departure.
                    properties:
                      day:
                        type: integer
                      month:
                        type: integer
                      year:
                        type: integer
                    required:
                      - day
                      - month
                      - year
                  stopOver:
                    type: boolean
                    description: >-
                      Set to `true` if this flight leg is a stopover, connecting
                      different destinations.
                  taxAmount:
                    type: integer
                    description: The tax amount for this specific flight leg.
                    example: 3500
                required:
                  - carrierCode
                  - flightCode
                  - departureAirport
                  - arrivalAirport
                  - departureDate
                  - fareClassCode
                  - taxAmount
              type: array
            restricted:
              type: boolean
              description: >-
                Typically, restricted airfares require approval and e-ticket
                processing within 24 hours of making the reservation, are not
                transferable if cancelled, and can have specific requirements on
                when or whether a cancelled ticket can be rebooked. You must
                define if the ticket is restricted, but this does not affect the
                payment flows.
            issueDate:
              type: object
              description: An object containing the ticket's issue date.
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
              required:
                - day
                - month
                - year
          required:
            - number
            - restricted
            - issuerAddress
        agentName:
          type: string
          description: The name of the travel agent.
          example: J Small and Co
          minLength: 1
          maxLength: 26
          pattern: ^[A-Za-z0-9 @!£*#\$()\+\-_=.,\/;:'"]+$
        agentCode:
          type: string
          description: The IATA travel agency code.
          example: '12345678'
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]+$
        invoiceReference:
          type: string
          description: Billing Settlement Plan invoice reference.
          minLength: 1
          maxLength: 14
          pattern: ^[A-Za-z0-9]+$
        airlineCode:
          type: string
          description: The two character IATA airline code.
          example: CA
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        passenger:
          type: object
          description: An object containing passenger details.
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 15
              pattern: ^[A-Za-z0-9]+$
            firstName:
              type: string
              minLength: 1
              maxLength: 60
              pattern: ^[A-Za-z @!£*#\$()\+\-_=.,\/;:'"]+$
            lastName:
              type: string
              minLength: 1
              maxLength: 60
              pattern: ^[A-Za-z @!£*#\$()\+\-_=.,\/;:'"]+$
          required:
            - code
            - firstName
            - lastName
      required:
        - type
        - ticket
        - airlineName
        - airlineCode
        - agentCode
        - passenger
    shipping:
      type: object
      description: An object containing shipping details.
      properties:
        sender:
          type: object
          properties:
            address:
              type: object
              description: An object containing sender's (shipped from) address.
              properties:
                postalCode:
                  maxLength: 10
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
        recipient:
          type: object
          properties:
            address:
              type: object
              description: An object containing recipient's shipping address.
              properties:
                countryCode:
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]*$
                  type: string
                postalCode:
                  maxLength: 10
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
    order:
      type: object
      description: An object containing details about the order.
      properties:
        taxExempt:
          type: boolean
          description: >-
            A flag to indicate whether the purchase is exempt from tax. Must be
            set to `true` if `order.salesTax` is 0.
        orderDate:
          type: object
          description: Date of the order.
          properties:
            day:
              type: integer
            month:
              type: integer
            year:
              type: integer
          required:
            - day
            - month
            - year
        items:
          description: >-
            Array of order items. You can send up to 99 individual order objects
            within this array.
          items:
            type: object
            required:
              - name
            properties:
              commodityCode:
                maxLength: 12
                minLength: 1
                type: string
                description: >-
                  Commodity code as defined by the National Institute of
                  Governmental Purchasing.
                pattern: ^[A-Za-z0-9@!£*#$)(-+_=.,/;:'"]{1,12}$
                example: ABC123@#
              totalTaxAmount:
                type: integer
                description: Total tax amount for the item(s).
              unitCost:
                type: integer
                description: The price of one unit of the item purchased.
              totalAmount:
                type: integer
                description: Total cost of the item(s) including tax.
              totalAmountNoTax:
                type: integer
                description: Total cost of the item(s) excluding tax.
              unitOfMeasure:
                maxLength: 8
                minLength: 1
                type: string
                description: >-
                  The unit of measure of the purchased item. Explains how to
                  interpret `items.quantity` field, e.g. quantity = 15,
                  unitOfMeasure = kg.
                pattern: ^[A-Za-z0-9@!£*#$)(+_=.,/;:'"-]{1,8}$
              name:
                maxLength: 26
                minLength: 1
                type: string
                description: Name of the item(s).
                pattern: ^[A-Za-z0-9 @!£*#$)(+_=.,/;:'"-]{1,26}$
              quantity:
                type: integer
                description: Number of items purchased.
              productCode:
                maxLength: 12
                minLength: 1
                type: string
                description: Merchant defined product code.
                pattern: ^[A-Za-z0-9@!£*#\$)(+_=.,/;:'"-]{1,12}$
              totalDiscountAmount:
                type: integer
                description: Total discount amount for the item(s).
          type: array
        dutyAmount:
          type: integer
          description: Total amount of duty costs for the order.
        salesTax:
          type: integer
          description: >-
            Total amount of sales tax for the order. Must be provided if
            `merchant.taxReference` is supplied.
        shippingAmount:
          type: integer
          description: Total amount of shipping costs for the order.
        invoiceReference:
          maxLength: 15
          minLength: 1
          type: string
          description: Invoice reference for the order.
          pattern: ^[A-Za-z0-9 @!£*#\$)\(+_=.,/;:'"-]{1,15}$
        discountAmount:
          type: integer
          description: Total amount of discounts for the order.
    orderReference:
      type: string
      description: >-
        A reference that you can apply to one or more payments according to your
        business needs. You may reuse the same reference across multiple
        payments, for example where:

        - the total amount for a single order is split across multiple payments

        - you use a single reference for each payment in a recurring agreement
        or split shipment scenario 
      maxLength: 64
      minLength: 1
      pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~/+]*$
      example: order-12345
    value:
      required:
        - amount
        - currency
      type: object
      description: An object that contains information about the value of the payment.
      properties:
        amount:
          type: integer
          description: >-
            The payment amount. This is a whole number with an exponent e.g. if
            exponent is two, 250 is 2.50.
          example: 250
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]$
          description: ' The three character currency code. See list of [supported currencies](/products/reference/supported-countries-currencies#iso-currency-codes).'
          example: USD
    expiryDateCard:
      required:
        - month
        - year
      type: object
      description: Contains your customer's card expiry date.
      properties:
        month:
          type: integer
          pattern: ^([1-9]|1[0-2])$
          example: 7
        year:
          type: integer
          pattern: ^([1-9]{1}[0-9]{3})$
          example: 2050
    expiryDateToken:
      required:
        - month
        - year
      type: object
      description: Contains your customer's token expiry date.
      properties:
        month:
          type: integer
          pattern: ^([1-9]|1[0-2])$
          example: 7
        year:
          type: integer
          pattern: ^([1-9]{1}[0-9]{3})$
          example: 2050
    cardHolderName:
      type: string
      minLength: 1
      maxLength: 255
      description: The cardholder's name as it appears on their card.
    cvc:
      type: string
      maxLength: 4
      minLength: 3
      pattern: ^[0-9]+$
      description: >-
        CVC is a unique set of 3 or 4 numbers used to verify the card. Our API
        checks to see if the CVC supplied matches the CVC held by the issuing
        bank.
    cardNumber:
      type: string
      maxLength: 19
      minLength: 12
      pattern: ^[0-9]+$
      description: >-
        Your customer's card number. Sometimes referred to as Primary Account
        Number (PAN).
    tokenNumber:
      type: string
      maxLength: 19
      minLength: 12
      pattern: ^[0-9]+$
      description: The network token number.
    billingAddress:
      required:
        - postalCode
        - countryCode
      type: object
      description: Contains the billing address information.
      properties:
        address1:
          type: string
          description: First line of the address. Required if `city` is provided.
        address2:
          type: string
          description: Second line of the address.
        address3:
          type: string
          description: Third line of the address.
        city:
          type: string
          description: City. Required if `address1` is provided.
        postalCode:
          type: string
          description: >-
            Post code. Required, but an empty value can be provided for specific
            countries (e.g., `IE`).
        state:
          type: string
          description: State/province in max 3 characters.
        countryCode:
          type: string
          description: >-
            Must be provided in [ISO 3166-1 Alpha-2
            format](/products/reference/supported-countries-currencies#iso-country-codes).
        phoneNumber:
          type: string
          description: Phone number.
          minLength: 3
          maxLength: 20
          pattern: ^[0-9()+-/.x ]+$
    customerInitiatedTransaction:
      required:
        - transactionReference
        - merchant
        - instruction
        - channel
      type: object
      properties:
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        orderReference:
          $ref: '#/components/schemas/orderReference'
        channel:
          enum:
            - ecom
            - moto
          type: string
          description: >-
            Interaction between the cardholder and you. Supply a value of `ecom`
            to process an eCommerce authorization. Supply a value of `moto` to
            process an authorization as a Mail Order or Telephone Order
            transaction. Note: 3DS `authentication` cannot be supplied for MOTO
            payments.
        merchant:
          required:
            - entity
          type: object
          description: An object that contains information about the merchant.
          properties:
            entity:
              $ref: '#/components/schemas/entity'
            mcc:
              $ref: '#/components/schemas/mcc'
            paymentFacilitator:
              $ref: '#/components/schemas/paymentFacilitator'
            taxReference:
              $ref: '#/components/schemas/taxReference'
        instruction:
          required:
            - value
            - narrative
            - paymentInstrument
            - requestAutoSettlement
          type: object
          description: An object that contains all information related to the payment.
          properties:
            requestAutoSettlement:
              type: object
              description: >-
                Indicates whether the transaction should be sent for settlement
                now `true` or later `false`, at a time of your choosing.
              properties:
                enabled:
                  type: boolean
            value:
              allOf:
                - $ref: '#/components/schemas/value'
                - type: object
                  properties:
                    estimated:
                      type: boolean
                      description: >-
                        Set to `true` for an estimated authorization value,
                        which you can [increase at a later
                        stage](/products/card-payments/manage-payments#increase-an-authorization).

                         **Note:** `requestAutoSettlement` must be `false` for estimated authorizations.
                    acceptPartialAmount:
                      type: boolean
                      description: >-
                        Set to `true` to accept partial authorization amount.
                        You can charge the remainder of the amount using a
                        different payment credential with a new authorization
                        request.

                          **Note:** `requestAutoSettlement` must be `false` for partial authorizations.
                    surchargeAmount:
                      type: integer
                      description: >-
                        The charging amount representing processing and service
                        fees. Ensure that the `surchargeAmount` complies with
                        local regulations and card network rules before
                        applying.

                          **Note:** The surcharge fee is included in the total transaction amount, e.g. if the `value.surchargeAmount` is $20 and the `value.amount` is $100, then the actual cost of goods/services is $80.
                    convenienceAmount:
                      type: integer
                      description: >-
                        The charging amount representing the offer of a
                        convenient payment method or channel (such as online
                        booking fee). Ensure that the `convenienceAmount`
                        complies with local regulations and card network rules
                        before applying.

                          **Note:** The convenience fee is included in the total transaction amount, e.g. if the `value.convenienceAmount` is $20 and the `value.amount` is $100, then the actual cost of goods/services is $80.
            narrative:
              $ref: '#/components/schemas/narrative'
            paymentInstrument:
              type: object
              oneOf:
                - $ref: '#/components/schemas/card_plain'
                - $ref: '#/components/schemas/card_token'
                - $ref: '#/components/schemas/card_networkToken'
                - $ref: '#/components/schemas/card_checkout'
                - $ref: '#/components/schemas/card_wallet_applepay'
                - $ref: '#/components/schemas/card_wallet_googlepay'
                - $ref: '#/components/schemas/card_networkToken_applepay'
                - $ref: '#/components/schemas/card_networkToken_googlepay'
              discriminator:
                mapping:
                  card/plain: '#/components/schemas/card_plain'
                  card/token: '#/components/schemas/card_token'
                  card/networkToken: '#/components/schemas/card_networkToken'
                  card/checkout: '#/components/schemas/card_checkout'
                  card/wallet+applepay: '#/components/schemas/card_wallet_applepay'
                  card/wallet+googlepay: '#/components/schemas/card_wallet_googlepay'
                  card/networkToken+applepay: '#/components/schemas/card_networkToken_applepay'
                  card/networkToken+googlepay: '#/components/schemas/card_networkToken_googlepay'
                propertyName: type
            customerAgreement:
              type: object
              description: Contains specific customer agreements for the transaction.
              oneOf:
                - $ref: '#/components/schemas/cit_cardOnFile'
                - $ref: '#/components/schemas/cit_subscription'
                - $ref: '#/components/schemas/cit_installment'
              discriminator:
                propertyName: type
                mapping:
                  cardOnFile: '#/components/schemas/cit_cardOnFile'
                  subscription: '#/components/schemas/cit_subscription'
                  installment: '#/components/schemas/cit_installment'
            consumerBillPayment:
              $ref: '#/components/schemas/consumerBillPayment'
            debtRepayment:
              $ref: '#/components/schemas/debtRepayment'
            requestAccountUpdater:
              $ref: '#/components/schemas/requestAccountUpdater'
            fundsTransfer:
              $ref: '#/components/schemas/fundsTransfer'
            routing:
              $ref: '#/components/schemas/routing'
        riskProfile:
          type: string
          description: >
            Used to apply the SCA exemption in the payment request and update
            the FraudSight data model to benefit future payments. 


            If using either the
            [FraudSight](/products/fraudsight/assessment#linking-the-fraudsight-assessment)
            or
            [Exemptions](/products/sca-exemptions/assessment#applying-the-exemption)
            API you __must__ provide this.
          example: https://try.access.worldpay.com/riskProfile/{linkData}
        authentication:
          description: An object containing authentication details.
          properties:
            threeDS:
              type: object
              description: >-
                3DS authentication data. Only allowed for `card/plain`,
                `card/token`, `card/checkout`, `card/networkToken` payment
                instruments.
              required:
                - version
                - eci
              properties:
                version:
                  maxLength: 10
                  minLength: 5
                  type: string
                  description: The version of 3DS used to process the transaction.
                  example: 2.2.0
                eci:
                  maxLength: 2
                  minLength: 2
                  type: string
                  description: Electronic Commerce Indicator (ECI).
                  example: '05'
                  pattern: ^[0-9]{2}$
                authenticationValue:
                  maxLength: 40
                  minLength: 1
                  type: string
                  description: >-
                    Required, if `authentication.eci` value is 01, 02, 05 or
                    06.  A cryptographic value that provides evidence of the
                    outcome of a 3DS verification.
                  example: kBNHXUAy4+HT1gAMBSDajheBcxQh
                transactionId:
                  maxLength: 36
                  minLength: 36
                  type: string
                  description: >-
                    Required, if `authentication.eci` value is 01, 02, 05 or
                    06.  A unique authentication transaction identifier,
                    generated by the issuer.
                  example: b8fb4ecc-7e2e-4b1c-816d-0149849776b8
                  format: RFC 4122 UUID
                cryptogramAlgorithm:
                  type: integer
                  description: >-
                    Indicates the algorithm used to generate the cryptogram. For
                    Cartes Bancaires authorizations only.
                  example: 2
                challengePreference:
                  type: string
                  description: >-
                    Indicates the preferred challenge behavior. For Cartes
                    Bancaires authorizations only. Must contain one of the
                    following values.
                  enum:
                    - noPreference
                    - noChallengeRequested
                    - challengeRequested
                    - challengeMandated
                    - noChallengeRequestedTRAPerformed
                authenticationFlow:
                  type: string
                  description: >-
                    Set to `challenge` if your customer was redirected to their
                    bank to complete authentication, or `frictionless` if your
                    customer completed authentication without needing to be
                    redirected to their bank. For Cartes Bancaires
                    authorizations only. Must contain one of the following
                    values.
                  enum:
                    - challenge
                    - frictionless
                    - frictionlessDelegated
                status:
                  type: string
                  description: >-
                    Indicates the outcome of the authentication or verification
                    request.
                     - `Y` - Successful authentication
                     - `N` - Failed authentication
                     - `U` - Unable to complete authentication
                     - `A` - Successful attempts authentication
                     - `I` - Exemption acknowledged

                     For Cartes Bancaires authorizations only.
                statusReason:
                  type: string
                  description: >-
                    Provides further information relating to the outcome of the
                    authentication. Returned for failed authentications only.
                    For Cartes Bancaires authorizations only.
                cancellationIndicator:
                  type: string
                  description: >-
                    An indicator as to why the authentication was cancelled. For
                    Cartes Bancaires authorizations only.
                  minLength: 2
                  maxLength: 2
                  pattern: ^[0-9]{2}$
                  example: '01'
                networkScore:
                  type: string
                  description: >-
                    The global score calculated by the Cartes Bancaires scoring
                    platform. For Cartes Bancaires authorizations only.
                  minLength: 1
                  maxLength: 2
                  pattern: ^[0-9]{1,2}$
                  example: '7'
                brand:
                  type: string
                  description: >-
                    The card brand used in the authentication. For Cartes
                    Bancaires authorizations only.
                  enum:
                    - cartesBancaires
            networkToken:
              type: object
              description: >-
                Network Token authentication. Only allowed for
                `card/networkToken` transactions.
              required:
                - cryptogram
              properties:
                cryptogram:
                  type: string
                  minLength: 1
                  maxLength: 40
                  example: BLIYQ4EA/wLF4/hK9ABFMAABAAA=
                  description: A payment specific value generated during authentication.
                eci:
                  maxLength: 2
                  minLength: 2
                  type: string
                  description: Electronic Commerce Indicator (ECI).
                  example: '05'
                  pattern: ^[0-9]{2}$
            customerData:
              type: object
              description: >-
                Additional customer details necessary to meet local
                authentication, as required by country-specific regulations.
                Currently, this object is used solely for domestic transactions
                in South Korea and applicable to `card/plain`, `card/token` and
                `card/checkout` instruments only.
              oneOf:
                - $ref: '#/components/schemas/southKorea_personalAuth'
                - $ref: '#/components/schemas/southKorea_corporateAuth'
              discriminator:
                mapping:
                  southKorea/personal: '#/components/schemas/southKorea_personalAuth'
                  southKorea/corporate: '#/components/schemas/southKorea_corporateAuth'
                propertyName: type
        exemption:
          $ref: '#/components/schemas/exemption'
        shipping:
          $ref: '#/components/schemas/shipping'
        order:
          $ref: '#/components/schemas/order'
        recipient:
          $ref: '#/components/schemas/recipient'
        customer:
          type: object
          description: Additional customer data.
          properties:
            documentReference:
              type: string
              description: >-
                Required for domestic processing in some Latin American
                countries.
              minLength: 1
              maxLength: 50
              pattern: ^[A-Za-z0-9_\-\/\\*~+.,&()]{1,50}$
            reference:
              type: string
              description: Merchant-generated customer reference.
              minLength: 1
              maxLength: 17
              pattern: ^[A-Za-z0-9 @!£*#$()\+\-_=.,/;:'"]{1,17}$
            ipAddress:
              type: string
              description: >-
                Customer's IP address. Required for certain jurisdictions and/or
                MCCs.
              minLength: 1
              maxLength: 50
              pattern: ^[a-zA-Z0-9\-:.]+$
            emailAddress:
              type: string
              description: >-
                Customer's email address. If enabled, your customer will receive
                the transaction outcome to this email address.
              minLength: 1
              maxLength: 128
              pattern: ^(?=(?:[^@]*@){1}[^@]*$)[\x20-\x7E]{1,128}$
        industryData:
          $ref: '#/components/schemas/industryData'
    merchantInitiatedTransaction:
      required:
        - transactionReference
        - merchant
        - instruction
      type: object
      properties:
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        orderReference:
          $ref: '#/components/schemas/orderReference'
        merchant:
          required:
            - entity
          type: object
          description: An object that contains information about the merchant.
          properties:
            entity:
              $ref: '#/components/schemas/entity'
            mcc:
              $ref: '#/components/schemas/mcc'
            paymentFacilitator:
              $ref: '#/components/schemas/paymentFacilitator'
            taxReference:
              $ref: '#/components/schemas/taxReference'
        instruction:
          required:
            - value
            - narrative
            - paymentInstrument
            - requestAutoSettlement
            - customerAgreement
          type: object
          description: An object that contains all information related to the payment.
          properties:
            requestAutoSettlement:
              type: object
              description: >-
                Indicates whether the transaction should be sent for settlement
                now `true` or later `false`, at a time of your choosing.
              properties:
                enabled:
                  type: boolean
            value:
              allOf:
                - $ref: '#/components/schemas/value'
                - type: object
                  properties:
                    acceptPartialAmount:
                      type: boolean
                      description: >-
                        Set to `true` to accept partial authorization amount.
                        The remainder of the amount can be charged using a
                        different payment credential via a new authorization
                        request.

                         **Note:** `requestAutoSettlement` must be `false` for partial authorizations.
                    surchargeAmount:
                      type: integer
                      description: >-
                        The charging amount representing processing and service
                        fees. Ensure that the `surchargeAmount` complies with
                        local regulations and card network rules before
                        applying.

                          **Note:** The `surchargeAmount` is included in the total transaction amount, e.g. if the `value.surchargeAmount` is $20 and the `value.amount` is $100, then the actual cost of goods/services is $80.
                    convenienceAmount:
                      type: integer
                      description: >-
                        The charging amount representing the offer of a
                        convenient payment method or channel (such as online
                        booking fee). Ensure that the `convenienceAmount`
                        complies with local regulations and card network rules
                        before applying.

                         **Note:** The convenience fee is included in the total transaction amount, e.g. if the `value.convenienceAmount` is $20 and the `value.amount` is $100, then the actual cost of goods/services is $80.
            narrative:
              $ref: '#/components/schemas/narrative'
            paymentInstrument:
              type: object
              oneOf:
                - $ref: '#/components/schemas/card_plain_mit'
                - $ref: '#/components/schemas/card_token_mit'
                - $ref: '#/components/schemas/card_networkToken'
                - $ref: '#/components/schemas/card_networkToken_applepay'
                - $ref: '#/components/schemas/card_networkToken_googlepay'
              discriminator:
                mapping:
                  card/plain: '#/components/schemas/card_plain_mit'
                  card/token: '#/components/schemas/card_token_mit'
                  card/networkToken: '#/components/schemas/card_networkToken'
                  card/networkToken+applepay: '#/components/schemas/card_networkToken_applepay'
                  card/networkToken+googlepay: '#/components/schemas/card_networkToken_googlepay'
                propertyName: type
            customerAgreement:
              type: object
              description: Contains specific customer agreements for the transaction.
              oneOf:
                - $ref: '#/components/schemas/mit_subscription'
                - $ref: '#/components/schemas/mit_installment'
                - $ref: '#/components/schemas/mit_unscheduled'
                - $ref: '#/components/schemas/mit_reauthorization'
                - $ref: '#/components/schemas/mit_resubmission'
                - $ref: '#/components/schemas/mit_noShow'
                - $ref: '#/components/schemas/mit_delayedCharge'
              discriminator:
                propertyName: type
                mapping:
                  subscription: '#/components/schemas/mit_subscription'
                  installment: '#/components/schemas/mit_installment'
                  unscheduled: '#/components/schemas/mit_unscheduled'
                  reauthorization: '#/components/schemas/mit_reauthorization'
                  resubmission: '#/components/schemas/mit_resubmission'
                  noShow: '#/components/schemas/mit_noShow'
                  delayedCharge: '#/components/schemas/mit_delayedCharge'
            consumerBillPayment:
              $ref: '#/components/schemas/consumerBillPayment'
            requestAccountUpdater:
              $ref: '#/components/schemas/requestAccountUpdater'
            debtRepayment:
              $ref: '#/components/schemas/debtRepayment'
            fundsTransfer:
              $ref: '#/components/schemas/fundsTransfer'
            routing:
              $ref: '#/components/schemas/routing'
        recipient:
          $ref: '#/components/schemas/recipient'
        shipping:
          $ref: '#/components/schemas/shipping'
        order:
          $ref: '#/components/schemas/order'
        customer:
          type: object
          description: Additional customer data.
          properties:
            documentReference:
              type: string
              description: >-
                Required for domestic processing in some Latin American
                countries.
              minLength: 1
              maxLength: 50
            reference:
              type: string
              description: Merchant-generated customer reference.
              minLength: 1
              maxLength: 17
            emailAddress:
              type: string
              description: >-
                Customer's email address. If enabled by your configuration, your
                customer will receive the transaction outcome at this email
                address.
              minLength: 1
              maxLength: 128
        industryData:
          $ref: '#/components/schemas/industryData'
        riskProfile:
          type: string
          description: Used to update the FraudSight data model to benefit future payments.
          example: https://try.access.worldpay.com/riskProfile/{linkData}
