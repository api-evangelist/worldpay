    post:
      tags:
        - Manage payments
      summary: Increase authorization amount
      description: >-
        If you want to increase an initial estimated authorization amount
        (submitted with `estimated` set to `true`), you can send a incremental
        authorization request.

         **Note:** You must use the latest next action links returned by the incremental authorization response to settle (full/partial) and cancel (full/partial) the increased authorized amount. Using the next action links returned in your estimated authorization response will not use any increased amounts.
      operationId: increaseAuthorize
      parameters:
        - name: linkData
          in: path
          description: Action link that's received in your request.
          required: true
          schema:
            type: string
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: application/vnd.worldpay.payments-v7+json
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            example: application/vnd.worldpay.payments-v7+json
      requestBody:
        content:
          application/vnd.worldpay.payments-v7+json:
            schema:
              $ref: '#/components/schemas/payments_increaseAuthorize'
            examples:
              Request to partially settle the authorization:
                description: Request to increase the initial estimated authorization
                value:
                  value:
                    amount: 500
                    currency: EUR
      responses:
        '202':
          description: >-
            The request to increase the authorization amount has been
            successfully processed
          content:
            application/vnd.worldpay.payments-v7+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/payments_increaseAuthorize_response'
                  - $ref: >-
                      #/components/schemas/payments_increaseAuthorize_response_refused
                discriminator:
                  mapping:
                    authorized: '#/components/schemas/payments_increaseAuthorize_response'
                    refused: >-
                      #/components/schemas/payments_increaseAuthorize_response_refused
                  propertyName: outcome
              examples:
                Successful response to increase the authorization amount:
                  description: >-
                    Successful response to increase an estimated authorization
                    amount
                  value:
                    outcome: authorized
                    amounts:
                      totalAuthorized: 1100
                      currency: EUR
                    issuer:
                      authorizationCode: T91252
