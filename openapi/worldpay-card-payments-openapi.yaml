    southKorea_personalAuth:
      required:
        - type
        - firstTwoOfPin
        - dateOfBirth
      type: object
      properties:
        type:
          type: string
          description: Personal card issued in South Korea.
          enum:
            - southKorea/personal
        firstTwoOfPin:
          type: string
          description: The first two characters of the card's PIN.
          minLength: 2
          maxLength: 2
          example: '34'
          pattern: ^[0-9]{2}$
        dateOfBirth:
          type: object
          description: Cardholder's date of birth.
          required:
            - day
            - month
            - year
          properties:
            day:
              type: integer
              example: 1
            month:
              type: integer
              example: 1
            year:
              type: integer
              example: 1900
    southKorea_corporateAuth:
      required:
        - firstTwoOfPin
        - businessRegistrationNumber
        - type
      type: object
      properties:
        type:
          type: string
          description: Corporate card issued in South Korea.
          enum:
            - southKorea/corporate
        firstTwoOfPin:
          type: string
          description: The first two characters of the card's PIN.
          minLength: 2
          maxLength: 2
          example: '34'
          pattern: ^[0-9]{2}$
        businessRegistrationNumber:
          type: string
          description: >-
            A unique identifier assigned to businesses when they register with
            the Korean tax authorities.
          minLength: 6
          maxLength: 10
    updatedPaymentInstrument:
      type: object
      description: Details of the updated payment instrument.
      properties:
        appliedNetworkToken:
          type: boolean
          description: Returned if the payment instrument was swapped for a network token.
        accountUpdaterMessage:
          type: string
          description: Details on the type of payment instrument update.
          enum:
            - The merchant is not registered in the update program
            - The account number was changed
            - The account was closed
            - TThe expiration date was changed
            - The issuing bank does not participate in the update program
            - Contact the cardholder for updated information
            - No match found
            - No changes found
          x-enumDescriptions:
            The account number was changed: >-
              A new card has been issued with a change in the card number.
              Returned for both Real-Time and Managed Account Updater.
            The account was closed: >-
              The account is closed and the card is no longer valid. Ask your
              customer for an alternative payment method. Returned for both
              Real-Time and Managed Account Updater.
            The expiration date was changed: >-
              A new card has been issued with an updated expiry date. In most
              cases the card number remains unchanged. Returned for both
              Real-Time and Managed Account Updater.
            The issuing bank does not participate in the update program: >-
              It is not known whether an account update is available. Returned
              for Managed Account Updater only.
            Contact the cardholder for updated information: >-
              A match was found but you may need to contact the cardholder for
              updated card details. This could be due to cardholder opt-out or
              other reasons. Returned for both Real-Time and Managed Account
              Updater.
          example: The account number was changed
        type:
          type: string
          example: card/plain+masked
        cardBin:
          pattern: ^[0-9*]+$
          type: string
          description: The updated card BIN (Bank Identification Number).
          example: '444433'
        lastFour:
          pattern: ^[0-9*]+$
          type: string
          description: >-
            The four digits of the updated card. Some characters may be
            obfuscated with a `*` if the PAN length is less than 16 characters.
          example: 1111
        cardNumber:
          type: string
          description: >-
            The full card number of the updated card. Returned only for
            merchants configured to receive card numbers that are not
            obfuscated.
          maxLength: 19
          minLength: 12
          pattern: ^[0-9]+$
        expiryDate:
          type: object
          properties:
            month:
              type: integer
            year:
              type: integer
        cardBrand:
          type: string
          description: >-
            The brand of the updated card. In rare circumstances a card may be
            reissued under a different brand.
        countryCode:
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]*$
          description: >-
            Country code of the updated card in [ISO 3166-1 Alpha-2
            format](/products/reference/supported-countries-currencies#iso-country-codes).
          example: GB
        fundingType:
          type: string
          description: How the card is funded.
    amounts:
      type: object
      description: >-
        An object containing transaction amounts. Returned for partial
        authorizations.
      properties:
        requested:
          type: integer
          description: The requested amount.
          example: 1000
        totalAuthorized:
          type: integer
          description: The total amount authorized by the card issuer.
          example: 700
        currency:
          maxLength: 3
          minLength: 3
          type: string
          pattern: ^[A-Z]$
          description: >-
            The three character currency code. See list of [supported
            currencies](/products/reference/supported-countries-currencies#iso-currency-codes).
          example: GBP
        partialAuthorization:
          type: boolean
          description: >-
            Indicates that the authorized amount is less than what was
            requested.
    riskFactors:
      type: array
      items:
        required:
          - type
          - risk
        type: object
        properties:
          type:
            enum:
              - avs
              - cvc
              - riskProfile
            type: string
          risk:
            enum:
              - notChecked
              - notMatched
              - notSupplied
              - verificationFailed
            type: string
            description: Result of the verification.
          detail:
            enum:
              - address
              - postcode
            type: string
      description: >-
        Any risk factors which have been identified for the authorization. This
        section will not appear if no risks are identified.
    scheme:
      required:
        - reference
      type: object
      description: An object containing information returned by the card scheme.
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The reference returned by the scheme for this particular payment
            authorization. The scheme reference returned in a customer initiated
            transaction should be provided in all subsequent merchant initiated
            transactions.
          example: 'MCCOLXT1C0104  '
    issuer:
      required:
        - authorizationCode
      type: object
      description: An object containing information returned by the issuer.
      properties:
        authorizationCode:
          pattern: ^[a-zA-Z0-9]+$
          type: string
          description: >-
            A code returned by the card issuer for a successful authorization.
            Used in reconciliation and dispute management.
          example: T31306
    responsePaymentInstrument:
      type: object
      description: Details of the paymentInstrument used.
      properties:
        type:
          type: string
        cardBin:
          pattern: ^[0-9*]+$
          type: string
          description: >-
            The card BIN (Bank Identification Number) is the first 6 or 8 digits
            of the card number, and can be used to identify the card issuer, the
            card brand(s) (eg Visa, Cartes Bancaires), and the country. Card
            BINs are used to route transactions, check card capabilities, and in
            fraud assessments.
          example: '444433'
        lastFour:
          pattern: ^[0-9*]+$
          type: string
          description: >-
            The last four digits of the card. Some characters may be obfuscated
            with a `*` if the PAN length is less than 16 characters.
          example: '1111'
        category:
          type: string
          description: >-
            Whether the card is classed as a consumer card or a card for
            commercial use.
          enum:
            - commercial
            - consumer
        countryCode:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
          type: string
          description: >-
            The [ISO 3166-1 Alpha-2
            format](/products/reference/supported-countries-currencies#iso-country-codes)
            country code that the card was issued in. May return `N/A` where the
            country is unknown.
          example: GB
        issuerName:
          type: string
          description: The name of the card issuer.
          example: AN ISSUING BANK LTD
        fundingType:
          type: string
          description: How the card is funded.
          enum:
            - credit
            - debit
            - prepaid
            - chargeCard
            - deferredDebit
            - unknown
        cardBrand:
          type: string
          description: >-
            The card brand that the transaction was processed with. Sometimes
            referred to as the network or scheme.
          enum:
            - visa
            - mastercard
            - amex
            - maestro
            - visaElectron
            - diners
            - discover
            - jcb
            - argencard
            - cabal
            - carteBleue
            - cartesBancaires
            - carnet
            - cencosud
            - coopeplus
            - credimas
            - dankort
            - elo
            - eftposAU
            - hipercard
            - italcred
            - naranja
            - nativa
            - nevada
            - nexo
            - tarjeta
            - unionPay
        paymentAccountReference:
          type: string
          description: >-
            The payment account reference (PAR) is a non-financial reference
            that uniquely identifies the underlying cardholder account. This
            allows you to correlate payments made from the same account with
            differing instruments (e.g. `card/plain` and
            `card/wallet+applepay`), where the same account funds the
            transaction. A PAR cannot be used to initiate a payment.
          example: Q1HJZ28RKA1EBL470G9XYG90R5D3E
        expiryDate:
          type: object
          description: >-
            The expiry date of the card or network token (where the supplied
            paymentInstrument was `card/wallet+applepay`,
            `card/wallet+googlepay`, `card/networkToken`,
            `card/networkToken+applepay` or `card/networkToken+googlepay`)
          properties:
            month:
              type: integer
            year:
              type: integer
        debitNetwork:
          type: string
          description: >-
            The debit network that the transaction was routed through. Returned
            optionally for subscribing merchants.
          enum:
            - accel
            - affn
            - alaskaOption
            - ath
            - culiancePrime
            - culiance
            - interlink
            - jeanie
            - maestro
            - nyce
            - pavd
            - pulse
            - shazam
            - star
            - starAccess
    advice:
      type: object
      description: Advice on the outcome of this request.
      properties:
        code:
          type: string
          description: >-
            An advice code returned by the card scheme (currently supported:
            `mastercard`, `maestro`)
      required:
        - code
    exemptionOutcome:
      required:
        - result
        - reason
      type: object
      description: >-
        An exemption result and reason if either a risk profile was included in
        your authorization request, or if you included the `exemption` object in
        the request.
      properties:
        result:
          enum:
            - honored
            - outOfScope
            - rejected
          type: string
          description: The result of the requested exemption.
        reason:
          enum:
            - highRisk
            - invalid
            - issuerHonored
            - issuerRejected
            - notSubscribed
            - oneLegOut
            - unsupportedAcquirer
          x-enumDescriptions:
            highRisk: >-
              The transaction is deemed high risk by our TRA (Transaction Risk
              Assessment), and therefore the acquirer exemption cannot be
              applied.
            invalid: >-
              The exemption is invalid. For example, a `lowValue` exemption was
              requested for a requested authorization value greater than 30 EUR.
            issuerHonored: The issuer has accepted the exemption.
            issuerRejected: >-
              The issuer has rejected the exemption. You may retry the
              authorization in certain circumstances (for example if you receive
              `refusalCode` 65, you can retry the transaction with valid 3DS
              `authentication` data).
            notSubscribed: >-
              You are not subscribed to the exemption service. Please contact
              your Worldpay Implementation Manager.
            oneLegOut: >-
              Either the issuer or the acquirer are located in a region where
              Strong Customer Authentication is not required. An exemption is
              not required.
            unsupportedAcquirer: >-
              Exemption processing is not currently supported through the
              selected acquirer.
          type: string
          description: |
            The reason for the exemption outcome. 
    commandId:
      maxLength: 36
      minLength: 21
      pattern: ^[A-Za-z0-9_-]+$
      type: string
      description: >-
        Unique identifier generated by us for a single instance of an
        interaction (command) with the Worldpay API.
      example: cmdRvD-OxCyXgJLQ9_jbqXAC0
    paymentId:
      maxLength: 36
      minLength: 21
      pattern: ^[A-Za-z0-9_-]+$
      type: string
      description: >-
        Unique identifier generated by us for a single payment. Generated at
        authorization, and maintained through successive payment actions.
      example: payI-dUcet9fk4_X4qZU0hpU0
