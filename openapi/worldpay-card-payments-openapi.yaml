    payments_partialSettle:
      required:
        - value
        - reference
      type: object
      properties:
        reference:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[-A-Za-z0-9]*$
          description: >-
            A reference generated by you to identify a payment throughout its
            lifecycle.
          example: partial-settle-reference
        value:
          allOf:
            - $ref: '#/components/schemas/value'
            - type: object
              properties:
                surchargeAmount:
                  type: integer
                  description: >-
                    The charging amount representing the processing and service
                    fees. Ensure that the `surchargeAmount` complies with local
                    regulations and card network rules before applying.

                     **Note:** The `surchargeAmount` is included in the partial settlement amount, e.g. if the `value.surchargeAmount` is $20 and the `value.amount` is $100, then the actual cost of goods/services is $80.
        merchant:
          type: object
          description: Contains information about the merchant.
          properties:
            taxReference:
              type: string
              description: Merchant's tax reference.
            marketplace:
              type: object
              description: Supply additional data for marketplace use cases.
              properties:
                sellerCountryCode:
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]{2}$
                  type: string
                  description: >-
                    Your seller's country code in [ISO 3166-1 Alpha-2
                    format](/products/reference/supported-countries-currencies#iso-country-codes).
                    Required if the seller is located in a different country to
                    the marketplace's domicile.
                  example: FR
                splitFundingReference:
                  maxLength: 256
                  minLength: 1
                  pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
                  type: string
                  description: >-
                    A reference that you can use to split acquiring funding into
                    your secondary bank account. Available for marketplaces and
                    other merchant types. Not available for North America or
                    Latin America payments. Contact your Worldpay Implementation
                    Manager to enable.
        customer:
          type: object
          description: Additional customer data.
          properties:
            reference:
              type: string
              description: Merchant-generated customer reference.
        shipping:
          $ref: '#/components/schemas/shipping'
        order:
          $ref: '#/components/schemas/order'
        industryData:
          $ref: '#/components/schemas/industryData'
        sequence:
          type: object
          required:
            - number
            - total
          description: >-
            The sequence number and total number of expected partial settlement
            requests for the payment.
          properties:
            number:
              type: integer
            total:
              type: integer
    payments_settle:
      type: object
      properties:
        reference:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[-A-Za-z0-9]*$
          description: >-
            A reference generated by you to identify a payment throughout its
            lifecycle.
          example: full-settle-reference
        value:
          type: object
          description: An object that contains information about the value of the payment.
          properties:
            surchargeAmount:
              type: integer
              description: >-
                The charging amount representing processing and service fees.
                Ensure that the `surchargeAmount` complies with local
                regulations and card network rules before applying.

                  **Note:** The surcharge fee is included in the total transaction amount, e.g. if the `value.surchargeAmount` is $20 and the total authorization amount was $100, then the actual cost of goods/services is 80.
        merchant:
          type: object
          description: Contains information about the merchant.
          properties:
            taxReference:
              type: string
              description: Merchant's tax reference.
        customer:
          type: object
          description: Additional customer data.
          properties:
            reference:
              type: string
              description: Merchant-generated customer reference.
        shipping:
          $ref: '#/components/schemas/shipping'
        order:
          $ref: '#/components/schemas/order'
        industryData:
          $ref: '#/components/schemas/industryData'
