openapi: 3.0.1
info:
  title: Card Payments
  description: >-
    Take online payments with our Card Payments API.


    __Authentication header__
      ```
        Authorization: {your_credentials}
      ```
    Replace `{your_credentials}` with your base64-encoded Basic Auth username
    and password given to your by your Worldpay Implementation Manager.

    <br /> <br />


    You **must** use the `Authorization` header for any request you send to our
    Card Payments API.


    __Accept/Content-Type header__
      ```
      Content-Type: application/vnd.worldpay.payments-v7+json
      Accept: application/vnd.worldpay.payments-v7+json
      ```
    We use the Accept header to identify which version of our API you are using.
    You must use the Accept header for any request you send to our Card Payments
    API.


    We require the Content-Type header if the request you're sending includes a
    request body, and if the HTTP method is a `POST` or a `PUT`.

    <br /><br />



    __DNS whitelisting__  

    Whitelist the following URLs:

    * `https://try.access.worldpay.com/`

    * `https://access.worldpay.com/`


    Please ensure you use DNS whitelisting, not explicit IP whitelisting.
  version: '7'
  x-metadata:
    category:
      - Card Payments
      - Wallets
    business:
      - Enterprise
      - Marketplaces
    catalog-list: true
    generated: false
servers:
  - url: https://try.access.worldpay.com
    description: Test (Try)
  - url: https://access.worldpay.com
    description: Live
