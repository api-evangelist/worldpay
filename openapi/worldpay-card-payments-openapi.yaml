    exemption:
      type: object
      required:
        - type
      description: >-
        An object for applying exemptions. If you are applying a TRA
        (Transaction Risk Assessment) exemption granted by us, use the
        `riskProfile` object
      oneOf:
        - $ref: '#/components/schemas/exemption_external'
        - $ref: '#/components/schemas/exemption_authentication-outage'
      discriminator:
        propertyName: type
        mapping:
          external: '#/components/schemas/exemption_external'
          authenticationOutage: '#/components/schemas/exemption_authentication-outage'
    exemption_external:
      allOf:
        - $ref: '#/components/schemas/exemption'
      type: object
      properties:
        type:
          $ref: '#/components/schemas/exemption_type'
        request:
          type: object
          description: The type of exemption to apply
          properties:
            placement:
              enum:
                - authorization
                - authentication
              x-enumDescriptions:
                authorization: Apply the exemption in the payment authorization
                authentication: The exemption has been applied in 3DS authentication
              type: string
              description: >
                Indicates whether the exemption should be placed in a payment
                authorization or 3DS authentication. 
            type:
              enum:
                - lowValue
                - lowRisk
              x-enumDescriptions:
                lowValue: Apply a lowValue exemption (authorization exemption only)
                lowRisk: Apply a lowRisk exemption
              type: string
              description: The type of exemption to apply.
    exemption_authentication-outage:
      allOf:
        - $ref: '#/components/schemas/exemption'
      type: object
      properties:
        type:
          $ref: '#/components/schemas/exemption_type'
    exemption_type:
      type: string
      x-enumDescriptions:
        external: >-
          TRA (Transaction Risk Assessment) exemption provided by a 3rd party
          provider
        authenticationOutage: >-
          Apply an exemption for recognized downstream 3DS authentication
          failures. This will increase the likelihood of receiving a successful
          authorization, but will not provide liability shift.
    fundsTransfer:
      type: object
      description: >-
        Contains details of the funds transfer request, which is a money
        movement for a reason other than the purchase of goods or services (also
        known as Account Funding Transaction (AFT)).
      required:
        - type
      properties:
        type:
          description: >-
            Specifies the type of the funds transfer. {% admonition
            type="warning" name="Note" %} You may only submit the
            `fundsTransfer.type` values that relate to the use cases that you
            have been approved for by the schemes.{% /admonition %}
          enum:
            - accountToAccount
            - cash
            - disbursement
            - personToPerson
            - purchase
            - topUp
            - walletLoad
          type: string
          x-enumDescriptions:
            accountToAccount: >-
              Move funds to another financial institution account owned by the
              same person
            cash: >-
              A card is used to fund a transfer where funds are given to the
              recipient in cash
            disbursement: A card is used as the source of funds for a disbursement
            personToPerson: Move funds to an account owned by another person (eg gifts)
            purchase: >-
              For the initial purchase of a reloadable account (such as prepaid
              or gift card), or direct crypto and liquid asset purchases without
              an intermediary wallet load
            topUp: Top up a pre-paid or debit card
            walletLoad: Move funds to a digital wallet owned by the same person
        purpose:
          description: >-
            Specifies the purpose of the funds transfer. Required for some
            regions and use cases (eg crypto).
          enum:
            - businessToBusiness
            - creditCardRepayment
            - crypto
            - crowdLending
            - debitCard
            - education
            - emergency
            - familySupport
            - gift
            - giftCard
            - gaming
            - highRiskSecurities
            - liquidAssets
            - medical
            - payroll
            - prepaidCard
            - salary
            - savings
            - travel
            - other
          type: string
        recipient:
          type: object
          description: >-
            An object containing details about the recipient of funds, including
            name and address information, as well as recipient account details.
            In many use cases, the recipient is the same person as the sender
            (for example if your customer uses their card to load funds into
            their own crypto exchange or investment account). __Although an
            optional object in the API schema, `recipient` is required for some
            regions and use cases.__
          properties:
            account:
              type: object
              description: An object for the account details of the recipient.
              oneOf:
                - $ref: '#/components/schemas/fundsTransfer_bankAccount'
                - $ref: '#/components/schemas/fundsTransfer_card'
                - $ref: '#/components/schemas/fundsTransfer_wallet'
                - $ref: '#/components/schemas/fundsTransfer_storedValueWallet'
                - $ref: '#/components/schemas/fundsTransfer_stagedDigitalWallet'
                - $ref: '#/components/schemas/fundsTransfer_merchantWallet'
                - $ref: '#/components/schemas/fundsTransfer_email'
                - $ref: '#/components/schemas/fundsTransfer_phone'
                - $ref: '#/components/schemas/fundsTransfer_socialNetwork'
              discriminator:
                propertyName: type
                mapping:
                  bankAccount: '#/components/schemas/fundsTransfer_bankAccount'
                  card: '#/components/schemas/fundsTransfer_card'
                  wallet: '#/components/schemas/fundsTransfer_wallet'
                  storedValueWallet: '#/components/schemas/fundsTransfer_storedValueWallet'
                  stagedDigitalWallet: '#/components/schemas/fundsTransfer_stagedDigitalWallet'
                  merchantWallet: '#/components/schemas/fundsTransfer_merchantWallet'
                  email: '#/components/schemas/fundsTransfer_email'
                  phone: '#/components/schemas/fundsTransfer_phone'
                  socialNetwork: '#/components/schemas/fundsTransfer_socialNetwork'
            firstName:
              maxLength: 35
              minLength: 1
              pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
              type: string
              description: >-
                Recipient's first name. Must be supplied if `lastName` or
                `middleName` are provided.
            middleName:
              maxLength: 35
              minLength: 1
              pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
              type: string
              description: Recipient's middle name.
            lastName:
              maxLength: 35
              minLength: 1
              pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
              type: string
              description: >-
                Recipient's last name. Must be supplied if `firstName` or
                `middleName` are provided.
            address:
              type: object
              description: The recipient's address.
              properties:
                address1:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                  description: Must be supplied if `city` is provided.
                address2:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                city:
                  maxLength: 100
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                  description: Must be supplied if `address1` is provided.
                postalCode:
                  maxLength: 10
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                state:
                  maxLength: 3
                  minLength: 1
                  pattern: ^[a-zA-Z0-9]*$
                  type: string
                  description: 1-3 alphanumeric characters and spaces.
                countryCode:
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]*$
                  type: string
                  description: >-
                    Country code in [ISO 3166-1 Alpha-2
                    format](/products/reference/supported-countries-currencies#iso-country-codes).
              required:
                - countryCode
            dateOfBirth:
              type: object
              description: Recipient's date of birth.
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
              required:
                - day
                - month
                - year
            phoneNumber:
              type: string
              description: Recipient's phone number.
              maxLength: 20
              minLength: 3
              pattern: ^[0-9 ()+\-/.x]*$
            documentReference:
              maxLength: 25
              minLength: 1
              type: string
              description: Recipient's document reference (e.g. Tax ID).
              pattern: ^[A-Za-z0-9\-\/+.()]*$
        sender:
          type: object
          description: >-
            An object containing details about the sender of funds, including
            name and address information. The sender account is always the card
            account declared within `instruction.paymentInstrument`. __Although
            an optional object in the API schema, `sender` is required for some
            regions and use cases.__
          properties:
            firstName:
              maxLength: 35
              minLength: 1
              pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
              type: string
              description: >-
                Sender's first name. Must be supplied if `lastName` or
                `middleName` are provided.
            middleName:
              maxLength: 35
              minLength: 1
              pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
              type: string
              description: Sender's middle name.
            lastName:
              maxLength: 35
              minLength: 1
              pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
              type: string
              description: >-
                Sender's last name. Must be supplied if `firstName` or
                `middleName` are provided.
            address:
              type: object
              description: The sender's address.
              properties:
                address1:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                  description: Must be supplied if `city` is provided.
                address2:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                city:
                  maxLength: 100
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                  description: Must be supplied if `address1` is provided.
                postalCode:
                  maxLength: 10
                  minLength: 1
                  pattern: ^[a-zA-Z0-9 ]*$
                  type: string
                state:
                  maxLength: 3
                  minLength: 1
                  pattern: ^[a-zA-Z0-9]*$
                  type: string
                  description: 1-3 alphanumeric characters and spaces.
                countryCode:
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]*$
                  type: string
                  description: >-
                    Country code in [ISO 3166-1 Alpha-2
                    format](/products/reference/supported-countries-currencies#iso-country-codes).
              required:
                - countryCode
            dateOfBirth:
              type: object
              description: Sender's date of birth.
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
              required:
                - day
                - month
                - year
            documentReference:
              maxLength: 25
              minLength: 1
              type: string
              description: Sender's document reference (e.g. Tax ID).
    fundsTransfer_bankAccount:
      type: object
      properties:
        type:
          enum:
            - bankAccount
          type: string
        identifierType:
          type: string
          enum:
            - iban
            - swift
            - routingNumber
            - accountNumber
        iban:
          maxLength: 34
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            The International Bank Account Number (IBAN) of the recipient.
            Required if `identifierType` is `iban`.
          example: IE12BOFI90000112345678
        accountNumber:
          maxLength: 39
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            The account number of the recipient. Required if `identifierType` is
            `routingNumber`, `swift` or `accountNumber`. Visa requires the value
            to be a maximum of 34 characters. 
          example: '01234567'
        swiftBic:
          maxLength: 11
          minLength: 8
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            The SWIFT Bank Identification Code (BIC) of the recipient. Required
            if `identifierType` is `swift`. Must be either 8 or 11 alphanumeric
            characters.
          example: BEASUS33xxx
        routingNumber:
          maxLength: 9
          minLength: 9
          pattern: ^[0-9]*$
          type: string
          description: >-
            The ABA (American Bankers Association) Routing Transit Number (RTN).
            Identifies the Financial Insititution of the recipient's account.
            Required if `identifierType` is `routingNumber`. Must be 9 numeric
            characters.
          example: '111000025'
      required:
        - type
        - identifierType
    fundsTransfer_card:
      type: object
      properties:
        type:
          enum:
            - card
          type: string
        cardNumber:
          maxLength: 19
          minLength: 12
          pattern: ^[0-9]*$
          type: string
          description: Recipient's card number.
      required:
        - type
        - cardNumber
    fundsTransfer_email:
      type: object
      properties:
        type:
          enum:
            - email
          type: string
        emailAddress:
          maxLength: 40
          minLength: 1
          type: string
          description: >-
            Recipient's email address. Visa requires the value to be a maximum
            of 34 characters.
      required:
        - type
        - emailAddress
    fundsTransfer_phone:
      type: object
      properties:
        type:
          enum:
            - phone
          type: string
        phoneNumber:
          maxLength: 20
          minLength: 3
          type: string
          description: Recipient's phone number.
          pattern: ^[0-9 ()+\-/.x]+$
      required:
        - type
        - phoneNumber
    fundsTransfer_wallet:
      type: object
      properties:
        type:
          enum:
            - wallet
          type: string
        walletReference:
          maxLength: 50
          minLength: 1
          pattern: ^[A-Za-z0-9@!£$*#)(+\-_=.,/:;"]*$
          type: string
          description: >-
            A reference identifying the destination wallet. Visa requires the
            value to be a maximum of 34 characters.
      required:
        - type
        - walletReference
    fundsTransfer_storedValueWallet:
      type: object
      properties:
        type:
          enum:
            - storedValueWallet
          type: string
        walletReference:
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            A reference identifying the destination wallet. Visa requires the
            value to be a maximum of 34 characters.
      required:
        - type
        - walletReference
    fundsTransfer_stagedDigitalWallet:
      type: object
      properties:
        type:
          enum:
            - stagedDigitalWallet
          type: string
        walletReference:
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            A reference identifying the destination wallet. Visa requires the
            value to be a maximum of 34 characters.
      required:
        - type
        - walletReference
    fundsTransfer_merchantWallet:
      type: object
      properties:
        type:
          enum:
            - merchantWallet
          type: string
        walletReference:
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            A reference identifying the destination wallet. Visa requires the
            value to be a maximum of 34 characters.
      required:
        - type
        - walletReference
    fundsTransfer_socialNetwork:
      type: object
      properties:
        type:
          enum:
            - socialNetwork
          type: string
        socialNetworkReference:
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9]*$
          type: string
          description: >-
            A reference identifying recipient's social network account. Visa
            requires the value to be a maximum of 34 characters.
      required:
        - type
        - socialNetworkReference
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
security:
  - BasicAuth: []
