    payments_cancel:
      type: object
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[-A-Za-z0-9]*$
          description: >-
            A reference generated by you to identify a payment throughout its
            lifecycle.
          example: full-cancellation-reference
    payments_partialCancel:
      required:
        - value
        - reference
      type: object
      properties:
        reference:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[-A-Za-z0-9]*$
          description: >-
            A reference generated by you to identify a payment throughout its
            lifecycle.
          example: partial-cancellation-reference
        value:
          $ref: '#/components/schemas/value'
    payments_refund:
      type: object
      properties:
        reference:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[-A-Za-z0-9]*$
          description: >-
            An optional reference generated by you to identify a payment
            throughout its lifecycle.
          example: refund-reference
        fastRefund:
          type: object
          description: Allows you to request a faster refund.
          required:
            - enabled
          properties:
            enabled:
              type: boolean
              description: Set to `true` to request fast refund.
            fallbackToStandard:
              type: boolean
              description: >-
                Fall back to standard refund processing in case the fast refund
                fails. Must be present if fast refund is set to `true`.
    payments_partialRefund:
      required:
        - value
        - reference
      type: object
      properties:
        reference:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[-A-Za-z0-9]*$
          description: >-
            A reference generated by you to identify a payment throughout its
            lifecycle.
          example: partial-refund-reference
        value:
          allOf:
            - $ref: '#/components/schemas/value'
            - type: object
              properties:
                surchargeAmount:
                  type: integer
                  description: >-
                    The charging amount representing processing and service fees
                    of the original transaction.

                      **Note:** The surcharge fee is included in the partial refund amount, e.g. if the `value.surchargeAmount` was $20 and the `value.amount` was $100, then the actual cost of goods/services was $80.
                convenienceAmount:
                  type: integer
                  description: >-
                    The charging amount representing the offer of a convenient
                    payment method or channel (such as online booking fee) of
                    the original transaction.

                      **Note:** Convenience fee is included in the partial refund amount, e.g. if the `value.convenienceAmount` was $20 and the `value.amount` was $100, then the actual cost of goods/services was $80.
        merchant:
          type: object
          description: Contains information about the merchant.
          properties:
            marketplace:
              type: object
              description: Supply additional data for marketplace use cases.
              properties:
                splitFundingReference:
                  maxLength: 256
                  minLength: 1
                  pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
                  type: string
                  description: >-
                    A reference that you can use to split acquiring funding into
                    your secondary bank account. Available for marketplaces and
                    other merchant types. Not available for North America or
                    Latin America payments. Contact your Worldpay Implementation
                    Manager to enable.
        fastRefund:
          type: object
          description: Allows you to request a faster refund.
          required:
            - enabled
          properties:
            enabled:
              type: boolean
              description: Set to `true` to request fast refund.
            fallbackToStandard:
              type: boolean
              description: >-
                Request to fall back to standard refund processing in case the
                fast refund fails. Must be present if fast refund is set to
                `true`.
    payments_events_200_response:
      required:
        - lastEvent
      type: object
      properties:
        lastEvent:
          type: string
          enum:
            - Authorized
            - Refused
            - Sent for Settlement
            - Sent for Refund
            - Sent for Cancellation
            - Refund failed
            - Settlement failed
            - Settled
            - Refunded
            - Error
            - Expired
          x-enumDescriptions:
            Authorized: >-
              The payment has been approved and the funds have been reserved in
              your customer's account.
            Refused: Your payment request has been declined.
            Sent for Settlement: >-
              A request has been made to move the reserved funds in your
              customer's account and transfer them to your Worldpay account.
            Sent for Refund: >-
              A request has been made to send funds back to your customer's
              account.
            Sent for Cancellation: >-
              A request has been made to cancel the payment without sending it
              for settlement.
            Refund failed: >-
              A refund request couldn't be processed and the funds were returned
              to your account.
            Settlement failed: >-
              A settlement request couldn't be processed. Funds have not been
              transferred to your Worldpay account.
            Settled: >-
              We have received the funds and are preparing to transfer them to
              your bank account. This event is only available in certain use
              cases.
            Refunded: >-
              The card issuer has received the refund request and they will
              return the funds to your customer's account. This event is only
              available in certain use cases.
            Error: >-
              The payment wasn't completed. You may want to reattempt the
              payment.
            Expired: >-
              The authorization validity period ended before a settlement or
              cancel request was made.
    payments_events_recovery_200_response:
      required:
        - lastEvent
      type: object
      properties:
        lastEvent:
          type: string
          enum:
            - Authorized
            - Refused
            - Sent for Settlement
            - Sent for Refund
            - Send for Cancellation
            - Refund failed
            - Settlement failed
            - Settled
            - Refunded
            - Error
            - Expired
          x-enumDescriptions:
            Authorized: >-
              The payment has been approved and the funds have been reserved in
              your customer's account.
            Refused: Your payment request has been declined.
            Sent for Settlement: >-
              A request has been made to move the reserved funds in your
              customer's account and transfer them to your Worldpay account.
            Sent for Refund: >-
              A request has been made to send funds back to your customer's
              account.
            Sent for Cancelation: >-
              A request has been made to cancel the payment without sending it
              for settlement.
            Refund failed: >-
              A refund request couldn't be processed and the funds were returned
              to your account.
            Settlement failed: >-
              A settlement request couldn't be processed. Funds have not been
              transferred to your Worldpay account.
            Settled: >-
              We have received the funds and are preparing to transfer them to
              your bank account. This event is only available in certain use
              cases.
            Refunded: >-
              The card issuer has received the refund request and they will
              return the funds to your customer's account. This event is only
              available in certain use cases.
            Error: >-
              The payment wasn't completed. You may want to reattempt the
              payment.
            Expired: >-
              The authorization validity period ended before a settlement or
              cancel request was made.
