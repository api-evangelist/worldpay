          type: string
          description: >-
            Entity description of the party, type is required when partyType is
            beneficiary
          nullable: true
        phones:
          type: array
          items:
            $ref: >-
              #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.Phone
          nullable: true
        identityDocuments:
          type: array
          items:
            $ref: >-
              #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.Identity
          nullable: true
        dateOfIncorporation:
          maximum: 10
          minimum: 10
          pattern: yyyy-MM-dd
          type: string
          description: >-
            Date of the Incorporation of the Company. Not allowed if for a
            person or sole trader.
          nullable: true
          example: '2024-01-01'
      additionalProperties: false
      description: Only supply either `partyReference` or `personalDetails`.
    WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.Phone:
      type: object
      properties:
        number:
          maximum: 20
          minimum: 1
          type: string
          description: >-
            Phone number of the party. Mandatory if you have provided `prefix`.
            Special characters are restricted.
          nullable: true
        prefix:
          maximum: 3
          minimum: 1
          type: string
          description: >-
            Phone dialing country code of the party. Mandatory if you have
            provided `phoneNumber`. Special characters are restricted.
            International country calling code following ITU-T standard. Must be
            1-3 digits e.g. \"44\" or \"420\"
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.PurposeOfPayment:
      type: object
      description: |-
        Details about the purpose of the payment.

         **Note:** View our [bank coverage guide](/products/marketplaces/coverage/bank) for country specific requirements.
      properties:
        code:
          enum:
            - WPPAYR
            - WPPENS
            - WPFAMT
            - WPUBIL
            - WPSTDY
            - WPTAXS
            - WPGDDS
            - WPCHAR
            - WPMDCS
            - WPSAVS
            - WPPROP
            - WPSCVE
            - WPSHAR
            - WPIVST
            - WPTKAG
            - WPTOUR
            - WPREMT
            - WPMOVR
            - WPSUPP
            - WPCAPI
            - WPCHRG
            - WPTRAN
            - WPSALR
            - WPDIVD
            - WPLOAN
            - WPISER
            - WPFSER
            - WPCARD
            - WPRENT
            - WPEXPE
            - WPTRNF
            - WPBONS
            - WPOTHR
          type: string
          description: >-
            The code that represents the purpose of the payout. This is
            mandatory for some payout routes.
          x-enumDescriptions:
            WPPAYR: Payment of payroll.
            WPPENS: Pension payment.
            WPFAMT: Family maintenance.
            WPUBIL: Payment to common utility provider.
            WPSTDY: Payment of study/tuition costs.
            WPTAXS: Payment of taxes.
            WPGDDS: Purchase sale of goods.
            WPCHAR: Payment for charity reasons.
            WPMDCS: Payment for medical care services.
            WPSAVS: Payment to savings/retirement account.
            WPPROP: Payment of property purchase.
            WPSCVE: Purchase sale of services.
            WPSHAR: Payment of shares.
            WPIVST: Payment of an investment (interest).
            WPTKAG: Tourism (invoiced tickets/travel agency costs).
            WPTOUR: Tourism (other).
            WPREMT: Remittances.
            WPMOVR: Payment of movable property rental.
            WPSUPP: Supplier payment.
            WPCAPI: Payment of capital contribution.
            WPCHRG: Charges/ fees.
            WPTRAN: Payment for transportation.
            WPSALR: Payment of salaries.
            WPDIVD: Dividends.
            WPLOAN: Loans.
            WPISER: Payment of insurance services.
            WPFSER: Payment for financial services.
            WPCARD: Card payments.
            WPRENT: Rental Payments.
            WPEXPE: Payment of expenses
            WPTRNF: Transfer of funds.
            WPBONS: Bonus/compensation.
            WPOTHR: Other.
        description:
          maximum: 35
          minimum: 1
          type: string
          description: >-
            Description for purpose of payout. This is mandatory for some payout
            routes.
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.Source:
      type: object
      properties:
        accountNumber:
          maximum: 16
          minimum: 16
          type: string
          description: >-
            Specifies which account should fund the payout, overriding the
            default account for your `entity`. Common uses include paying
            sellers from your own account (e.g. credit notes) or choosing among
            multiple accounts in the same currency. The account must belong to
            your `entity`.
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.SuccessResponseV3:
      type: object
      properties:
        payoutRequestId:
          type: string
          description: >-
            Payout Request ID associated with a payout submitted through our
            Account Payouts API. PN/PZ/PO prefix plus 6 characters.
        idempotencyKey:
          description: Unique reference from the request header of the same name.
        entity:
          type: string
          description: >-
            Your entity reference created as part of on-boarding. Used to route
            the request in Access Worldpay.
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.WalletDetails:
      type: object
      properties:
        walletIdentifierType:
          enum:
            - walletId
            - email
            - phoneNumber
          type: string
          description: ''
        walletIdentifier:
          maximum: 64
          minimum: 0
          type: string
          description: Beneficiary wallet identifier.
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.BatchIdentifier:
      type: object
      properties:
        entity:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.BatchPayout:
      required:
        - transactionReference
      type: object
      properties:
        instruction:
          $ref: >-
            #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.PayoutInstruction
        transactionReference:
          maximum: 50
          minimum: 6
          type: string
          description: >-
            Reference for the payout request provided by you. Must be unique for
            all items within a batch request. We recommend you specify a value
            which is unique across all of your payouts to ensure you receive the
            right data throughout the payout lifecycle. <a
            href="/products/marketplaces/coverage/bank/additionalinfo#special-characters">Special
            characters</a> are allowed.
        merchant:
          $ref: >-
            #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.Merchant
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.PayoutBatchRequest:
      type: object
      properties:
        merchant:
          $ref: >-
            #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.Merchant
        payouts:
          maximum: 500
          minimum: 1
          type: array
          items:
            $ref: >-
              #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.BatchPayout
          description: Holds information about the individual payouts.
          nullable: true
        notificationUrl:
          type: string
          description: Currently not in use.
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.PayoutBatchUniqueIdAndUbrV3:
      type: object
      properties:
        transactionReference:
          type: string
          nullable: true
        payoutRequestId:
          type: string
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutItemSearch.V2.Models.Pagination:
      required:
        - pageNumber
        - pageSize
      type: object
      properties:
        pageNumber:
          type: integer
          description: >-
            Positive whole number indicating which page of the statement to
            return. Greater than 0.
          format: int32
        pageSize:
          maximum: 499
          minimum: 1
          type: integer
          description: Number of items listed per page.
          format: int32
        pageCount:
          type: integer
          description: Total number of pages.
          format: int32
        totalNumberOfRecords:
          type: integer
          description: Total number of items listed across all pages.
          format: int32
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutItemSearch.V3.Models.GetOriginalItemResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: >-
              #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutItemSearch.V3.Models.OriginalItem
          nullable: true
        pagination:
          $ref: >-
            #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutItemSearch.V2.Models.Pagination
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.PayoutItemSearch.V3.Models.OriginalItem:
      required:
        - payoutRequestId
      type: object
      properties:
        paymentId:
          type: string
          description: Unique identifier associated with the payment. GUID.
          nullable: true
        paymentDatetime:
          type: string
          description: Date and time of the payment submission. DateTime ISO 8601.
          format: date-time
          nullable: true
        payeeName:
          maximum: 140
          type: string
          description: "Complete payee name for the payout. This will be one of (depending on the beneficiary type):\r\nfullName- concatenated value from title + firstName + middleName + lastName\r\ncompanyName."
          nullable: true
        sourceCurrency:
          maximum: 3
          type: string
          description: >-
            <a
            href="/products/reference/supported-countries-currencies#currency-codes">ISO
            4217 alpha-3 currency code</a> for the remitter account.
          nullable: true
        sourceAmount:
          type: number
          description: Source amount. 18 digit precision including 2 decimal places.
          format: double
        targetCurrency:
          maximum: 3
          minimum: 3
          type: string
          description: >-
            Target <a
            href="/products/reference/supported-countries-currencies#currency-codes">ISO
            4217 alpha-3 currency codes</a> for the payout.
          nullable: true
        targetAmount:
          type: number
          description: Target amount.
          format: double
        paymentState:
          enum:
            - AWAITING_EXECUTION
            - NEW
            - VALID
            - REJECTED
            - EXECUTED
            - IN_REVIEW
            - RFI_IN_PROGRESS
            - AWAITING_LIQUIDITY
            - COMPLETED
            - REVERSED
            - FAILED
            - INVALID
          type: string
          description: State of the payout.
          nullable: true
          x-enumDescriptions:
            AWAITING_EXECUTION: >-
              Interim state in the asynchronous payout request. Please contact
              your Relationship Manager if this persists, as this might suggest
              integration issues.
            NEW: >-
              Interim state in the asynchronous payout request. Please contact
              your Relationship Manager if this persists, as this might suggest
              integration issues.
            VALID: >-
              Interim state in the asynchronous payout request. Please contact
              your Relationship Manager if this persists, as this might suggest
              integration issues.
            REJECTED: >-
              Interim state in the asynchronous payout request. Please contact
              your Relationship Manager if this persists, as this might suggest
              integration issues.
            EXECUTED: >-
              The API has accepted your payout request and it is now waiting in
              the queue for submission to our banking partner.
            IN_REVIEW: >-
              Payout is currently under review as part of our standard
              compliance procedures. No action is required from you at this
              time. We will notify you separately once the review is complete or
              if we require any further information from you.
            RFI_IN_PROGRESS: >-
              Payout is currently on hold pending the completion of our standard
              compliance review. We require additional information from you and
              will be in touch with the specific details needed. Please respond
              at your earliest convenience to help us resolve this as quickly as
              possible.

                **Note:** Please contact your Worldpay Implementation Manager if you want to receive this.
            AWAITING_LIQUIDITY: >-
              Payout is currently on hold due to insufficient funds. Please
              deposit funds into your Worldpay account in order to release the
              payout and ensure future payouts aren't also held in this state.

                **Note:** Please contact your Worldpay Implementation Manager if you want to receive this.
            COMPLETED: >-
              Our banking partner has accepted the payout request for
              processing. Final state or `REVERSED` in a return scenario.
            REVERSED: >-
              Our validation rules, banking partner or beneficiary bank has
              rejected the payout request. The funds have subsequently been
              returned to your account.  All rejected payouts include a
              description with reasoning (if available).
            FAILED: >-
              Final state in the asynchronous payout request. Please contact
              your Relationship Manager if this persists, as this might suggest
              integration issues.
            INVALID: >-
              Final state in the asynchronous payout request. Please contact
              your Relationship Manager if this persists, as this might suggest
              integration issues.
        bankName:
          type: string
          description: >-
            Name of the payee (beneficiary) bank which the payout is being made
            to.
          nullable: true
        bankCode:
          type: string
          description: Beneficiary bank account bank code.
          nullable: true
        iban:
          type: string
          description: Beneficiary IBAN.
          nullable: true
        estimatedDeliveryDate:
          type: string
          nullable: true
        outcomeReason:
          type: string
          nullable: true
        channel:
          type: string
          description: List of the channels that were sent in the request for this payout.
          nullable: true
        routedChannel:
          type: string
          description: The channel that was used to process this payout.
          nullable: true
        bankReference:
          type: string
          description: >-
            A bank-generated reference that enables your customers to track
            their payout within the payment network. This feature is only
            available for specific routes. For details on availability, please
            contact your Relationship Manager.
          nullable: true
        payoutRequestId:
          maximum: 10
          minimum: 8
          pattern: AlphaNumericRegex = ^[0-9a-zA-Z]+$
          type: string
          description: >-
            Unique payout request ID associated with a payout submitted through
            our Account Payouts API. PN/PZ/PO prefix plus 6 characters.
        narrative:
          maximum: 50
          minimum: 0
          type: string
          description: Reference that may appear on beneficiary statements.
          nullable: true
        transactionReference:
          maximum: 50
          minimum: 0
          type: string
          description: Unique reference provided by you.
          nullable: true
        accountNumber:
          maximum: 50
          minimum: 0
          type: string
          description: Bank Account number.
          nullable: true
        swiftBic:
          maximum: 50
          type: string
          description: Beneficiary bank account SWIFT/BIC.
          nullable: true
        countryCode:
          maximum: 2
          minimum: 2
          type: string
          description: >-
            <a
            href="/products/reference/supported-countries-currencies#iso-country-codes">ISO
            3166-1 Alpha-2 country code</a> of the payout destination.
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel:
      type: object
      properties:
        errorName:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        validationErrors:
          type: array
          items:
            $ref: >-
              #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwJsonPathErrorModel
          nullable: true
      additionalProperties: false
    WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwJsonPathErrorModel:
      type: object
      properties:
        errorName:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        jsonPath:
          type: string
          nullable: true
      additionalProperties: false
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
security:
  - BasicAuth: []
tags:
  - name: Single payout
    description: Make a single payout to an account using our Account Payouts endpoint.
  - name: Batch payout
    description: Make up to 500 payouts in one batch using our Account Payouts endpoint.
  - name: Get payouts by Payout Request ID
    description: Search for payout details by using a Payout Request ID.
  - name: Get payouts
    description: Search for payout details by filtering parameters.
