      responses:
        '200':
          description: >-
            OK response if a request with the same credentials has already been
            submitted successfully
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.BatchIdentifier
              example:
                entity: default
                idempotencyKey: mustBeUnique12345
        '202':
          description: ACCEPTED response if request body has no validation errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.PayoutBatchUniqueIdAndUbrV3
              example:
                - transactionReference: '202401'
                  payoutRequestId: PN000CYV
                - transactionReference: '202402'
                  payoutRequestId: PN000CYW
                - transactionReference: '202403'
                  payoutRequestId: PN000CYX
                - transactionReference: '202404'
                  payoutRequestId: PN000CYY
                - transactionReference: '202405'
                  payoutRequestId: PN000CYZ
                - transactionReference: '202406'
                  payoutRequestId: PN000CY2
                - transactionReference: '202407'
                  payoutRequestId: PN000CY3
                - transactionReference: '202408'
                  payoutRequestId: PN000CY4
                - transactionReference: '202409'
                  payoutRequestId: PN000CY5
        '400':
          description: BAD REQUEST response describing request body validation errors
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                validationErrors:
                  - jsonPath: >-
                      $.payouts[0].instruction.parties[0].personalDetails.phones[0].number
                    errorName: stringIsTooLong
                    message: number must be between 1-20 digits length
                  - jsonPath: >-
                      $.payouts[0].instruction.parties[0].personalDetails.phones[0].prefix
                    errorName: stringIsTooLong
                    message: prefix must be between 1-3 digits length
                  - jsonPath: >-
                      $.payouts[1].instruction.parties[0].personalDetails.phones[0].number
                    errorName: stringIsTooLong
                    message: number must be between 1-20 digits length
                  - jsonPath: >-
                      $.payouts[1].instruction.parties[0].personalDetails.phones[0].prefix
                    errorName: stringIsTooLong
                    message: prefix must be between 1-3 digits length
                errorName: bodyDoesNotMatchSchema
                message: There was an error in the request
        '401':
          description: >-
            UNAUTHORIZED Your call is unauthorized, please contact our support
            team
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: unauthorized
                message: Invalid token
        '403':
          description: FORBIDDEN Your call is unauthorized, please contact our support team
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: forbidden
                message: "Forbidden.\_Unauthorised\_request"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: null
                message: Unexpected Issue. Please try again
  /accountPayouts/{payoutRequestId}:
    get:
      tags:
        - Get payouts by Payout Request ID
      summary: Retrieve payout details
      operationId: GetByPayoutRequestId
      parameters:
        - name: payoutRequestId
          in: path
          required: true
          schema:
            type: string
            description: >-
              Unique payout request ID associated with the original payout. We
              have returned this in the payout response. PN/PZ/PO prefix plus 6
              characters.
            example: PZ000N65
        - name: WP-CorrelationId
          in: header
          description: >-
            A unique identifier used to trace and correlate a request across
            systems. Must be a GUID.
          schema:
            type: string
          example: 15cd16b2-7b82-41cb-9b11-21be9dacad88
        - name: WP-Timestamp
          in: header
          schema:
            type: string
            default: '1755681620'
        - name: WP-Api-Version
          in: header
          description: The version of the API you are using.
          schema:
            type: string
            default: '2025-01-01'
          example: '2025-01-01'
        - name: Idempotency-Key
          in: header
          description: >-
            A unique key to identify the request. This is used to prevent
            duplicate processing of the same request.
          schema:
            maximum: 35
            minimum: 1
            type: string
            default: mustBeUnique12345
          example: mustBeUnique12345
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
            example: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutItemSearch.V3.Models.OriginalItem
              example:
                paymentId: 51a448e5-4430-ee11-b58a-005056b48b8e
                paymentDatetime: '2023-08-01T08:24:44.443Z'
                payeeName: John Smith
                sourceCurrency: ARS
                sourceAmount: 0
                targetCurrency: ARS
                targetAmount: 1.05
                paymentState: EXECUTED
                bankName: Test Bank
                bankCode: 10 02 04
                iban: GB29NWBK60161331926819
                channel: WIRE,ACH SD
                routedChannel: WIRE
                bankReference: ABCHK26
                payoutRequestId: PO000N65
                narrative: XYZ102025
                transactionReference: XYZ102025
                accountNumber: '45533882'
                swiftBic: BUKBGB22
                entity: default
                countryCode: AR
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: unauthorized
                message: Invalid token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: Forbidden
                message: Forbidden. Unauthorized request
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: notFound
                message: Payment not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: null
                message: An unexpected error occurred.
  /accountPayouts/events:
    get:
      tags:
        - Get payouts
      summary: Retrieve payout details
      operationId: GetByQuery
      parameters:
        - name: narrative
          in: query
          description: Reference that may appear on beneficiary statements.
          schema:
            maximum: 50
            minimum: 0
            type: string
            description: Reference that may appear on beneficiary statements.
        - name: transactionReference
          in: query
          description: Unique reference provided by you.
          schema:
            maximum: 50
            minimum: 0
            type: string
            description: Unique reference provided by you.
        - name: accountNumber
          in: query
          description: Beneficiary bank account number.
          schema:
            maximum: 64
            minimum: 0
            type: string
            description: Beneficiary bank account number.
        - name: payoutInstrumentId
          in: query
          description: >-
            A unique ID generated by us, holding the beneficiary bank details.
            You receive this in the response after successfully creating a
            payout instrument in our <a
            href="/products/parties/openapi/payout-instruments">Parties API</a>.
          schema:
            type: string
            description: >-
              A unique ID generated by us, holding the beneficiary bank details.
              You receive this in the response after successfully creating a
              payout instrument in our <a
              href="/products/parties/openapi/payout-instruments">Parties
              API</a>.
        - name: payoutInstrumentReference
          in: query
          description: >-
            A reference of the payoutInstrument created by you. This field holds
            the beneficiary bank details.
          schema:
            type: string
            description: >-
              A reference of the payoutInstrument created by you. This field
              holds the beneficiary bank details.
        - name: pageSize
          in: query
          description: >-
            Positive whole number indicating the number of payouts to return in
            each page.
          required: true
          schema:
            maximum: 499
            minimum: 1
            type: integer
            description: >-
              Positive whole number indicating the number of payouts to return
              in each page.
            format: int32
        - name: entity
          in: query
          description: >-
            Your entity reference created as part of on-boarding. Used to route
            the request in Access Worldpay.
          schema:
            maximum: 6
            minimum: 6
            type: string
            description: >-
              Your entity reference created as part of on-boarding. Used to
              route the request in Access Worldpay.
        - name: countryCode
          in: query
          description: >-
            <a
            href="/products/reference/supported-countries-currencies#iso-country-codes">ISO
            3166-1 Alpha-2 country code</a> of the payout destination.
          schema:
            maximum: 2
            minimum: 2
            type: string
            description: >-
              <a
              href="/products/reference/supported-countries-currencies#iso-country-codes">ISO
              3166-1 Alpha-2 country code</a> of the payout destination.
        - name: pageNumber
          in: query
          description: >-
            Positive whole number indicating which page of the statement to
            return.
          required: true
          schema:
            minimum: 1
            type: integer
            description: >-
              Positive whole number indicating which page of the statement to
              return.
            format: int32
        - name: paymentState
          in: query
          schema:
            maximum: 255
            enum:
              - AWAITING_EXECUTION
              - NEW
              - VALID
              - REJECTED
              - EXECUTED
              - IN_REVIEW
              - RFI_IN_PROGRESS
              - AWAITING_LIQUIDITY
              - COMPLETED
              - REVERSED
              - FAILED
              - INVALID
            type: string
            x-enumDescriptions:
              AWAITING_EXECUTION: >-
                Interim state in the asynchronous payout request. Please contact
                your Relationship Manager if this persists, as this might
                suggest integration issues.
              NEW: >-
                Interim state in the asynchronous payout request. Please contact
                your Relationship Manager if this persists, as this might
                suggest integration issues.
              VALID: >-
                Interim state in the asynchronous payout request. Please contact
                your Relationship Manager if this persists, as this might
                suggest integration issues.
              REJECTED: >-
                Interim state in the asynchronous payout request. Please contact
                your Relationship Manager if this persists, as this might
                suggest integration issues.
              EXECUTED: >-
                The API has accepted your payout request and it is now waiting
                in the queue for submission to our banking partner.
              IN_REVIEW: >-
                Payout is currently under review as part of our standard
                compliance procedures. No action is required from you at this
                time. We will notify you separately once the review is complete
                or if we require any further information from you.
              RFI_IN_PROGRESS: >-
                Payout is currently on hold pending the completion of our
                standard compliance review. We require additional information
                from you and will be in touch with the specific details needed.
                Please respond at your earliest convenience to help us resolve
                this as quickly as possible.
              AWAITING_LIQUIDITY: >-
                Payout is currently on hold due to insufficient funds. Please
                deposit funds into your Worldpay account in order to release the
                payout and ensure future payouts aren't also held in this state.
              COMPLETED: >-
                Our banking partner has accepted the payout request for
                processing. Final state or `REVERSED` in a return scenario.
              REVERSED: >-
                Our validation rules, banking partner or beneficiary bank has
                rejected the payout request. The funds have subsequently been
                returned to your account.  All rejected payouts include a
                description with reasoning (if available).
              FAILED: >-
                Final state in the asynchronous payout request. Please contact
                your Relationship Manager if this persists, as this might
                suggest integration issues.
              INVALID: >-
                Final state in the asynchronous payout request. Please contact
                your Relationship Manager if this persists, as this might
                suggest integration issues.
        - name: startDate
          in: query
          description: "Posting start date for the payout. This is the start of a time window. This must be before the current date and before the end date, as well as being after the minimum date (0001-01-01). The difference between start and end dates should not exceed 31 days. \tMust be a Gregorian calendar date with ISO 8601 format YYYY-MM-DD."
          schema:
            maximum: 10
            minimum: 10
            type: string
