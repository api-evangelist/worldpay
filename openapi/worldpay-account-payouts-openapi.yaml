openapi: 3.0.1
info:
  title: Account Payouts
  description: "Send funds to your customer's bank accounts and search for payouts using parameters.\n\n \r\n  \r\n    __Authentication header__\r\n\r\n      ```\r\n        Authorization: {your_credentials}\r\n      ```\r\n      Replace `{your_credentials}` with your base64-encoded Basic Auth username and password given to you by your Worldpay Implementation Manager.\r\n      <br /> <br />\r\n      You **must** use the `Authorization` header for any request you send to our Account Payouts API\r\n      <br /><br />\r\n      __WP-Api-Version header__\r\n      ```\r\n        WP-Api-Version: 2025-01-01\r\n      ```\r\n\r\n    We use the WP-Api-Version header to identify which version of our API you are using. \r\n    <br /><br />\r\n    __DNS whitelisting__\r\n\r\n    Whitelist the following URLs:\r\n    * `https://try.access.worldpay.com/`\r\n    * `https://access.worldpay.com/`\r\n\r\n    Please ensure you use DNS whitelisting, not explicit IP whitelisting. When you make a request within Access Worldpay, you should always cache the response returned."
  version: '2025-01-01'
  x-metadata:
    business:
      - Enterprise
      - Marketplaces
    catalog-list: true
    category:
      - Payouts
    generated: true
servers:
  - url: https://try.access.worldpay.com
    description: Test (Try)
  - url: https://access.worldpay.com
    description: Live
paths:
  /accountPayouts:
    post:
      tags:
        - Single payout
      summary: Make a single payout
      operationId: PostPayout
      parameters:
        - name: WP-CorrelationId
          in: header
          description: >-
            A unique identifier used to trace and correlate a request across
            systems. Must be a GUID.
          schema:
            type: string
          example: 15cd16b2-7b82-41cb-9b11-21be9dacad88
        - name: WP-Timestamp
          in: header
          schema:
            type: string
            default: '1755681620'
        - name: WP-Api-Version
          in: header
          description: The version of the API you are using.
          schema:
            type: string
            default: '2025-01-01'
          example: '2025-01-01'
        - name: Idempotency-Key
          in: header
          description: >-
            A unique key to identify the request. This is used to prevent
            duplicate processing of the same request.
          schema:
            maximum: 35
            minimum: 1
            type: string
            default: mustBeUnique12345
          example: mustBeUnique12345
        - name: Content-Type
          in: header
          description: >-
            Specifies the media type of the resource or the data being sent.
            This field informs the server or client how to interpret the body of
            the request or response.
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.IndividualPayout
            examples:
              SEPA:
                value:
                  merchant:
                    entity: default
                  instruction:
                    value:
                      sourceCurrency: EUR
                      sourceAmount: 0
                      targetCurrency: EUR
                      targetAmount: 199.99
                    narrative:
                      line1: PushtoAccount with Worldpay
                    countryCode: GB
                    beneficiaryBankDetails:
                      iban: GB41CITI18500818404062
                      bankName: Citibank London
                    parties:
                      - partyType: beneficiary
                        personalDetails:
                          type: Company
                          companyName: Worldpay AP Ltd
                        address:
                          address1: 25 Walbrook
                          city: London
                          postalCode: EC4N 8AF
                          countryCode: GB
                  transactionReference: ABC123456
              UK Faster Payout:
                value:
                  merchant:
                    entity: default
                  instruction:
                    value:
                      sourceCurrency: GBP
                      sourceAmount: 0
                      targetCurrency: GBP
                      targetAmount: 199.99
                    narrative:
                      line1: PushtoAccount with Worldpay
                    countryCode: GB
                    beneficiaryBankDetails:
                      accountNumber: '18404100'
                      bankCode: '185008'
                      bankName: Citibank London
                    parties:
                      - partyType: beneficiary
                        personalDetails:
                          type: Company
                          companyName: Worldpay AP Ltd
                        address:
                          address1: 25 Walbrook
                          city: London
                          postalCode: EC4N 8AF
                          countryCode: GB
                  transactionReference: ABC123456
              Full account payout request with payer:
                value:
                  merchant:
                    entity: default
                  instruction:
                    value:
                      sourceCurrency: GBP
                      sourceAmount: 0
                      targetCurrency: EUR
                      targetAmount: 199.99
                    narrative:
                      line1: PushtoAccount with Worldpay
                    purposeOfPayment:
                      code: WPREMT
                      description: Money Remittance
                    countryCode: GB
                    transactionType: customerToCustomer
                    quoteId: ''
                    expandableKeyValuePairs:
                      remitterSourceOfIncome: salary
                      intermediaryBankSwiftBic: BARCGB22
                    beneficiaryBankDetails:
                      accountType: checking
                      accountNumber: '12345677'
                      iban: GB41CITI18500818404062
                      branchCode: ''
                      bankCode: '185008'
                      swiftBic: CITIGB2L
                      bankName: Citibank London
                      address:
                        address1: 25 Canada Square
                        address2: ''
                        city: London
                        state: ''
                        postalCode: E14 5LB
                        countryCode: GB
                    parties:
                      - partyType: beneficiary
                        personalDetails:
                          type: Person
                          title: Mr
                          firstName: John
                          middleName: ''
                          lastName: Doe
                          dateOfBirth: '1993-12-31'
                          email: john@domain.com
                          phones:
                            - number: '7777777777'
                              prefix: '44'
                          identityDocuments:
                            - type: passport
                              number: E1122234
                              issuingInstitution: Mayor of London
                              issuingCountry: GB
                              validFrom: '2013-05-22'
                              validTo: '2014-05-21'
                        address:
                          address1: 25 Walbrook
                          address2: ''
                          city: London
                          state: ''
                          postalCode: EC4N 8AF
                          countryCode: GB
                          type: home
                          residentialStatus: resident
                      - partyType: payer
                        customerReference: Account123456
                        personalDetails:
                          type: Person
                          title: Ms
                          firstName: Maria
                          middleName: ''
                          lastName: Doe
                          dateOfBirth: '1994-05-12'
                          email: maria@domain.com
                          phones:
                            - number: '7888888888'
                              prefix: '44'
                          identityDocuments:
                            - type: passport
                              number: E1122277
                              issuingInstitution: Mayor of London
                              issuingCountry: GB
                              validFrom: '2017-06-15'
                              validTo: '2027-06-14'
                        address:
                          address1: De Entree 248
                          address2: ''
                          city: Amsterdam
                          state: ''
                          postalCode: 1101 EE
                          countryCode: NL
                          type: home
                          residentialStatus: resident
                  transactionReference: ABC123456
              US ACH:
                value:
                  merchant:
                    entity: default
                  instruction:
                    value:
                      sourceCurrency: USD
                      sourceAmount: 0
                      targetCurrency: USD
                      targetAmount: 199.99
                    narrative:
                      line1: PushtoAccount with Worldpay
                    countryCode: US
                    channel: PayPal
                    beneficiaryBankDetails:
                      accountType: checking
                      accountNumber: '00000000031378655'
                      bankCode: '021000089'
                      bankName: Citibank New York
                    parties:
                      - partyType: beneficiary
                        personalDetails:
                          type: Company
                          companyName: RealNet Payments LLC
                        address:
                          address1: 4900 W Brown Deer Road
                          city: Milwaukee
                          state: WI
                          postalCode: '53223'
                          countryCode: US
                  transactionReference: ABC123456
              Marketplace account payout request including payout instrument:
                value:
                  merchant:
                    entity: default
                  instruction:
                    value:
                      sourceCurrency: GBP
                      sourceAmount: 199.99
                      targetAmount: 0
                    countryCode: US
                    beneficiaryBankDetails:
                      payoutInstrumentReference: BeneficiaryBankGBP
                  transactionReference: ABC123456
              Crypto payout:
                value:
                  merchant:
                    entity: default
                  instruction:
                    value:
                      sourceCurrency: USD
                      sourceAmount: 0
                      targetAmount: 199.99
                    narrative:
                      line1: CryptoPayout with Worldpay
                    countryCode: US
                    channel: polygon
                    beneficiaryWalletDetails:
                      type: walletId
                      walletId: '0x7bD3a4F8c91eE2F4b0c14F72bC8A3b9D8dE12A55'
                    parties:
                      - partyType: beneficiary
                        personalDetails:
                          type: person
                          title: mx
                          firstName: John
                          middleName: ''
                          lastName: Doe
                          dateOfBirth: '1993-12-31'
                        address:
                          address1: 4900 W Brown Deer Road
                          city: Milwaukee
                          state: WI
                          postalCode: '53223'
                          countryCode: US
                  transactionReference: ABC123456
      responses:
        '200':
          description: >-
            OK response if a request with the same credentials has already been
            submitted successfully
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.SuccessResponseV3
              example:
                payoutRequestId: PZ000EC4
                idempotencyKey: mustBeUnique12345
                entity: default
        '202':
          description: ACCEPTED response if request body has no validation errors.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Payout.V3.Models.SuccessResponseV3
              example:
                payoutRequestId: PZ000EC4
                idempotencyKey: mustBeUnique12345
                entity: default
        '400':
          description: BAD REQUEST response describing request body validation errors
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                validationErrors:
                  - jsonPath: $.instruction.parties[0].personalDetails.phones[0].number
                    errorName: stringIsTooLong
                    message: number must be between 1-20 digits length
                errorName: bodyDoesNotMatchSchema
                message: There was an error in the request
        '401':
          description: >-
            UNAUTHORIZED Your call is unauthorized, please contact our support
            team
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: unauthorized
                message: Invalid token
        '403':
          description: FORBIDDEN Your call is unauthorized, please contact our support team
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: forbidden
                message: "Forbidden.\_Unauthorised\_request"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/WP.FXT.SinglePayoutApi.Domain.Shared.ErrorModels.AwBodyErrorModel
              example:
                errorName: null
                message: Unexpected Issue. Please try again
  /accountPayouts/batch:
    post:
      tags:
        - Batch payout
      summary: Make a batch payout
      operationId: PostBatchPayout
      parameters:
        - name: WP-CorrelationId
          in: header
          description: >-
            A unique identifier used to trace and correlate a request across
            systems. Must be a GUID.
          schema:
            type: string
          example: 15cd16b2-7b82-41cb-9b11-21be9dacad88
        - name: WP-Timestamp
          in: header
          schema:
            type: string
            default: '1755681620'
        - name: WP-Api-Version
          in: header
          description: The version of the API you are using.
          schema:
            type: string
            default: '2025-01-01'
          example: '2025-01-01'
        - name: Idempotency-Key
          in: header
          description: >-
            A unique key to identify the request. This is used to prevent
            duplicate processing of the same request.
          schema:
            maximum: 35
            minimum: 1
            type: string
            default: mustBeUnique12345
          example: mustBeUnique12345
        - name: Content-Type
          in: header
          description: >-
            Specifies the media type of the resource or the data being sent.
            This field informs the server or client how to interpret the body of
            the request or response.
          schema:
            type: string
            default: application/json
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/WP.FXT.SinglePayoutApi.Domain.PayoutBatch.V2.Models.PayoutBatchRequest
            examples:
              Payout Customers:
                value:
                  merchant:
                    entity: default
                  payouts:
                    - instruction:
                        value:
                          sourceCurrency: EUR
                          sourceAmount: 0
                          targetCurrency: EUR
                          targetAmount: 199.99
                        narrative:
                          line1: Testing invalid bank details
                        countryCode: GB
                        beneficiaryBankDetails:
                          iban: GB41CITI18500818404062
                          bankName: Citibank London
                        parties:
                          - partyType: beneficiary
                            personalDetails:
                              type: Company
                              companyName: Worldpay AP Ltd
                            address:
                              address1: 25 Walbrook
                              city: London
                              postalCode: EC4N 8AF
                              countryCode: GB
                      transactionReference: ABC123456
                    - instruction:
                        value:
