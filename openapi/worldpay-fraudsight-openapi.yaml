    fraudsight_updatePayment:
      required:
        - transactionReference
        - merchant
        - riskProfile
        - paymentOutcome
      type: object
      properties:
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        merchant:
          required:
            - entity
          type: object
          description: >-
            An object that contains information about the merchant and API level
            configuration.
          properties:
            entity:
              $ref: '#/components/schemas/entity'
        riskProfile:
          maxLength: 2048
          minLength: 39
          type: string
          format: uri
          description: >-
            Represents the outcome of the original fraud assessment. Used to
            link subsequent Fraud related requests.
        paymentOutcome:
          enum:
            - authorized
            - refused
          type: string
          description: Outcome of the payment authorization.
        refusalCode:
          type: string
          maxLength: 2048
          minLength: 1
          description: The refusal response code from the acquirer.
          example: '5'
        refusalDescription:
          type: string
          maxLength: 2048
          minLength: 1
          description: The description of the 'refusalCode'.
          example: REFUSED
        cvcResult:
          enum:
            - matched
            - not_matched
            - not_checked
            - not_supplied
          type: string
          description: Outcome of the CVC check.
        avsResult:
          type: object
          description: Object containing outcome of the address verification service check.
          properties:
            address:
              enum:
                - matched
                - not_matched
                - not_checked
                - not_supplied
              type: string
              description: Outcome of the address check.
            postcode:
              enum:
                - matched
                - not_matched
                - not_checked
                - not_supplied
              type: string
              description: Outcome of the postcode check.
        authentication:
          type: object
          description: >-
            Include this object if 3DS authentication details were part of the
            payment.
          properties:
            version:
              maxLength: 10
              minLength: 5
              pattern: ^([0-9]{1,3})(\.)([0-9]){1,3}(\.)([0-9]{1,3})*$
              type: string
              description: 3DS version used by issuer, e.g. `1.0.2`, `2.1.0` or `2.2.0`.
            eci:
              maxLength: 2
              minLength: 2
              enum:
                - '00'
                - '01'
                - '02'
                - '05'
                - '06'
                - '07'
              type: string
              description: >
                Electronic Commerce Indicator (ECI). Outcome of the 3DS
                authentication as applied in the payment.
                  - 02 or 05 - Fully Authenticated Transaction
                  - 01 or 06 - Attempted Authentication Transaction
                  - 00 or 07 - Non 3-D Secure Transaction
                  - Mastercard - 02, 01, 00
                  - Visa - 05, 06, 07
                  - Amex - 05, 06, 07
                  - JCB - 05, 06, 07
                  - Diners - 05, 06, 07
