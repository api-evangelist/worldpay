    industryData:
      type: object
      description: An object containing industry specific order data.
      properties:
        type:
          enum:
          - airline
          type: string
        airlineName:
          type: string
          description: The name of the airline (displayed as it would be on a bill).
          example: Cobb Air
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9 @!£*#\$()\+\-_=.,\/;:'"]+$
        ticket:
          type: object
          description: An object containing ticket details.
          properties:
            number:
              type: string
              description: The ticket number.
              example: '123'
              minLength: 1
              maxLength: 16
              pattern: ^[A-Za-z0-9]+$
            issuerAddress:
              type: object
              description: An object containing the ticket issuer's address.
              properties:
                address1:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9 ]+$
                city:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[A-Za-z0-9 ]+$
                countryCode:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: ^[A-Z]{2}$
                postalCode:
                  type: string
                  minLength: 1
                  maxLength: 10
                  pattern: ^[A-Za-z0-9 ]+$
              required:
              - address1
              - city
              - countryCode
              - postalCode
            flightDetails:
              description: An array with objects containing flight details. Each object represents one leg of a flight and you can submit up to four flight legs within this array.
              items:
                type: object
                properties:
                  fareClassCode:
                    type: string
                    description: The code used by airlines to identity a fare type.
                    minLength: 1
                    maxLength: 15
                    pattern: ^[A-Za-z0-9]+$
                  departureAirport:
                    type: string
                    description: The three letter IATA Airport Code for the departure airport.
                    example: LHR
                    minLength: 3
                    maxLength: 3
                    pattern: ^[A-Z]{3}$
                  arrivalAirport:
                    type: string
                    description: The three letter IATA Airport Code for the destination airport.
                    example: SYD
                    minLength: 3
                    maxLength: 3
                    pattern: ^[A-Z]{3}$
                  carrierCode:
                    type: string
                    description: Same as `industryData.airlineCode`, the code represents the airline for the specific flight leg.
                    example: M1
                    minLength: 2
                    maxLength: 2
                    pattern: ^[A-Z]{2}$
                  fareBasisCode:
                    type: string
                    description: An optional extension to the `fareClassCode` for custom codes.
                    example: TMYA
                    minLength: 1
                    maxLength: 15
                    pattern: ^[A-Za-z0-9]+$
                  flightCode:
                    type: string
                    description: The flight code.
                    example: '501'
                    minLength: 1
                    maxLength: 5
                    pattern: ^[0-9]+$
                  departureDate:
                    type: object
                    description: An object containing the date of the departure.
                    properties:
                      day:
                        type: integer
                      month:
                        type: integer
                      year:
                        type: integer
                    required:
                    - day
                    - month
                    - year
                  stopOver:
                    type: boolean
                    description: Set to `true` if this flight leg is a stopover, connecting different destinations.
                  taxAmount:
                    type: integer
                    description: The tax amount for this specific flight leg.
                    example: 3500
                required:
                - carrierCode
                - flightCode
                - departureAirport
                - arrivalAirport
                - departureDate
                - fareClassCode
                - taxAmount
              type: array
            restricted:
              type: boolean
              description: Typically, restricted airfares require approval and e-ticket processing within 24 hours of making the reservation, are not transferable if cancelled, and can have specific requirements on when or whether a cancelled ticket can be rebooked. You must define if the ticket is restricted, but this does not affect the payment flows.
            issueDate:
              type: object
              description: An object containing the ticket's issue date.
              properties:
                day:
                  type: integer
                month:
                  type: integer
                year:
                  type: integer
              required:
              - day
              - month
              - year
          required:
          - number
          - restricted
          - issuerAddress
        agentName:
          type: string
          description: The name of the travel agent.
          example: J Small and Co
          minLength: 1
          maxLength: 26
          pattern: ^[A-Za-z0-9 @!£*#\$()\+\-_=.,\/;:'"]+$
        agentCode:
          type: string
          description: The IATA travel agency code.
          example: '12345678'
          minLength: 1
          maxLength: 8
          pattern: ^[0-9]+$
        invoiceReference:
          type: string
          description: Billing Settlement Plan invoice reference.
          minLength: 1
          maxLength: 14
          pattern: ^[A-Za-z0-9]+$
        airlineCode:
          type: string
          description: The two character IATA airline code.
          example: CA
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        passenger:
          type: object
          description: An object containing passenger details.
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 15
              pattern: ^[A-Za-z0-9]+$
            firstName:
              type: string
              minLength: 1
              maxLength: 60
              pattern: ^[A-Za-z @!£*#\$()\+\-_=.,\/;:'"]+$
            lastName:
              type: string
              minLength: 1
              maxLength: 60
              pattern: ^[A-Za-z @!£*#\$()\+\-_=.,\/;:'"]+$
          required:
          - code
          - firstName
          - lastName
      required:
      - type
      - ticket
      - airlineName
      - airlineCode
      - agentCode
      - passenger
    payments_increaseAuthorize_response:
      type: object
      properties:
        outcome:
          type: string
