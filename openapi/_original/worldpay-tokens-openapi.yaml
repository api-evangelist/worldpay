            create a token request matches the data stored with us.<br/><br/>The
            existing token resource reference is returned in the
            tokenPaymentInstrument object.<br><br> **Note:** Sometimes we match
            a token even if the data doesn't seem quite the same. For example,
            if we have a billing address on file, this address is retained, if
            no `billingAddress` object was supplied in your request.
