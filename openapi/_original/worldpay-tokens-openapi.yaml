openapi: 3.0.1
info:
  title: Tokens
  version: '3'
  x-metadata:
    category:
      - Tokens
    business:
      - Enterprise
    catalog-list: true
    generated: false
  description: >-
    Minimize the exposure of sensitive card details and increase the security of
    your customer's card details. 


    __Authentication header__

      ```
        Authorization: {your_credentials}
      ```
      Replace `{your_credentials}` with your base64-encoded Basic Auth username and password given to you by your Worldpay Implementation Manager.
      <br /> <br />
      You **must** use the `Authorization` header for any request you send to our Tokens API.
      <br /><br />
      __Accept & Content-Type headers__
      ```
        Accept: application/vnd.worldpay.tokens-v3.hal+json
        Content-Type: application/vnd.worldpay.tokens-v3.hal+json
      ```

    We use the Accept header to identify which version of our API you are using.
    You must use the Accept header for any request you send to our Tokens API. 

    <br><br>

    For detokenization requests, adapt the Accept header to also pass masked =
    false, as follows: `Accept:` `'application/vnd.worldpay.tokens-v3.hal+json;
    masked=false'`<br>

    {% admonition type="warning" name="Important" %}Detokenizing exposes your
    business to high levels of PCI auditing, required to remain PCI compliant.{%
    /admonition %}<br><br>

    We require the Content-Type header if the request you're sending includes a
    request body, and if the HTTP method is a POST or a PUT.

    <br /><br />

    __DNS whitelisting__


    Whitelist the following URLs:

    * `https://try.access.worldpay.com/`

    * `https://access.worldpay.com/`


    Please ensure you use DNS whitelisting, not explicit IP whitelisting. When
    you make a request within Access Worldpay, you should always cache the
    response returned.
servers:
  - url: https://try.access.worldpay.com
    description: Test (Try)
  - url: https://access.worldpay.com
    description: Live
