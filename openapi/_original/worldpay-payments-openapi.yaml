          $ref: '#/components/schemas/Customer'
        shipping:
          $ref: '#/components/schemas/Shipping'
        customerAgreement:
          oneOf:
            - $ref: '#/components/schemas/PaymentsCardOnFileCustomerAgreement'
            - $ref: '#/components/schemas/PaymentsInstallmentCustomerAgreement'
            - $ref: '#/components/schemas/PaymentsSubscriptionCustomerAgreement'
            - $ref: '#/components/schemas/PaymentsUnscheduledCustomerAgreement'
        recipient:
          $ref: '#/components/schemas/PaymentsRecipient'
        consumerBillPayment:
          type: boolean
          description: >-
            An attribute that identifies a bill payment paid by providers on
            behalf of consumers. If you are registered with Visa as a Consumer
            of the Bill Payment Service (CBPS), you must set this to `true` for
            any payments associated with the CBPS.
        fundsTransfer:
          $ref: '#/components/schemas/PaymentsFundsTransfer'
      required:
        - method
        - narrative
        - paymentInstrument
        - value
    PaymentsIntegratedThreeDS:
      allOf:
        - $ref: '#/components/schemas/PaymentsThreeDS'
        - type: object
          properties:
            type:
              type: string
              description: ThreeDS type.
              enum:
                - integrated
            mode:
              type: string
              enum:
                - always
            challenge:
              $ref: '#/components/schemas/Challenge'
              description: >-
                An object containing 3DS challenge preferences and
                configuration.
            deviceData:
              $ref: '#/components/schemas/DeviceData'
              description: An object containing device data for 3DS & Fraud assessment.
            previousSuspiciousActivity:
              type: boolean
              description: Has the account been flagged for suspicious activity.
            userType:
              type: string
              enum:
                - guestUser
                - registeredUser
                - federatedAccount
                - issuerCredentials
                - thirdPartyAuthentication
                - fidoAuthenticator
            accountHistory:
              $ref: '#/components/schemas/AccountHistory'
              description: Customer account history.
            reorder:
              type: boolean
              description: Repeat of a previous order.
            preOrderDate:
              type: string
              description: Expected date that a pre-ordered purchase will be available.
            transactionHistory:
              $ref: '#/components/schemas/TransactionHistory'
              description: Object containing details of the last transaction.
            giftCardsPurchase:
              $ref: '#/components/schemas/PaymentsGiftCardsPurchase'
              description: If the order is being used to purchase a gift card.
            exemptionOnOutage:
              type: boolean
              description: >-
                "Attempt authorization (without liability shift) using an
                authentication outage exemption in the event of a 3DS network
                failure. Even with this boolean set they are not currently part
                of default merchant setup. See [how to enable authentication
                outage
                exemptions](/products/payments/enable-features/3ds-authentication#how-to-enable-authentication-outage-exemptions)" 
      description: >-
        An object containing 3DS authentication preferences.


        Read more on how to set it up under our [__3DS
        Authentication__](/products/payments/enable-features/3ds-authentication)
        guide.
      required:
        - challenge
        - deviceData
        - mode
        - type
    PaymentsNetworkTokenPaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              enum:
                - networkToken
            tokenNumber:
              type: string
              description: The network token number.
              maxLength: 19
              minLength: 12
              pattern: '[0-9]*$'
            cardHolderName:
              type: string
              description: The name as shown on the card.
              maxLength: 255
              minLength: 1
            cryptogram:
              type: string
              description: >-
                The single-use cryptogram provisioned for this payment. Required
                for all Customer Initiated Transactions (CITs). <br><br>
                __Note:__ If the `cryptogram` and `eci` are not provided, the
                Payments API will __automatically__ attempt to provision them.
                This will only be successful for Network Tokens created via
                Worldpay. For Network Tokens created via other gateways you must
                provide these.
              maxLength: 40
              minLength: 1
            eci:
              type: string
              description: Electronic Commerce Indicator.
              pattern: ^\d{2}$
            expiryDate:
              $ref: '#/components/schemas/ExpiryDate'
            billingAddress:
              $ref: '#/components/schemas/PaymentsBillingAddress'
      required:
        - expiryDate
        - tokenNumber
        - type
    PaymentsPaymentFacilitator:
      type: object
      properties:
        schemeId:
          type: string
          description: Your payment facilitator ID received from Mastercard, Visa and Amex.
          example: '12345678901'
          maxLength: 11
          minLength: 1
          pattern: '[0-9]*$'
        independentSalesOrganizationId:
          type: string
          description: Independent Sales Organization (ISO) ID provided by Mastercard.
          example: '12345678901'
          maxLength: 11
          minLength: 1
          pattern: '[0-9]*$'
        subMerchant:
          $ref: '#/components/schemas/PaymentsSubMerchant'
          description: Your sub-merchant's details.
      required:
        - schemeId
        - subMerchant
    PaymentsPaymentInstrument:
      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: The type of instrument.
      required:
        - type
    PaymentsPhoneAccount:
      allOf:
        - $ref: '#/components/schemas/PaymentsRecipientAccount'
        - type: object
          properties:
            type:
              type: string
              enum:
                - phone
            phoneNumber:
              type: string
              description: Recipient's phone number.
              maxLength: 20
              minLength: 4
              pattern: ^(?!\s*$)[0-9\s()+\-/.x]*$
      required:
        - phoneNumber
        - type
    PaymentsRecipient:
      type: object
      description: >-
        An object containing information about the recipient of financial
        services. Required for MCC 6012 transactions in the Visa Europe region.
        The recipient may or may not be the cardholder.


        Read more on how to set it up under our [__Financial
        Services__](/products/payments/enable-features/financial-services-mcc6012-mcc6051)
        guide.
      properties:
        accountReference:
          type: string
          description: >-
            The account number of the recipient. Either a bank account number or
            a partial card number.
          maxLength: 10
          minLength: 1
          pattern: ^[A-Za-z0-9]*$
        lastName:
          type: string
          description: The last name of the recipient.
          maxLength: 22
          minLength: 1
          pattern: ^[A-Za-z@!£*#$)(+\-_=.,/;:'"]*$
        address:
          $ref: '#/components/schemas/PaymentsRecipientAddress'
        dateOfBirth:
          type: string
          format: date
          description: Recipient's date of birth.
    PaymentsRecipientAccount:
      type: object
      discriminator:
        propertyName: type
        mapping:
          bankAccount: '#/components/schemas/PaymentsBankAccount'
          card: '#/components/schemas/PaymentsCardAccount'
          wallet: '#/components/schemas/PaymentsWalletAccount'
          storedValueWallet: '#/components/schemas/PaymentsWalletAccount'
          stagedDigitalWallet: '#/components/schemas/PaymentsWalletAccount'
          merchantWallet: '#/components/schemas/PaymentsWalletAccount'
          email: '#/components/schemas/PaymentsEmailAccount'
          phone: '#/components/schemas/PaymentsPhoneAccount'
          socialNetwork: '#/components/schemas/PaymentsSocialNetworkAccount'
      properties:
        type:
          type: string
          description: The type of account.
      required:
        - type
    PaymentsRecipientAddress:
      type: object
      properties:
        postalCode:
          type: string
          description: The postal code of the recipient. Relevant only in the UK.
          maxLength: 10
          minLength: 1
          pattern: ^[A-Za-z0-9 ]*$
    PaymentsShippingAddress:
      type: object
      properties:
        address1:
          type: string
          description: Address line 1
          maxLength: 80
          minLength: 1
        address2:
          type: string
          description: Address line 2
          maxLength: 80
          minLength: 1
        address3:
          type: string
          description: Address line 3
          maxLength: 80
          minLength: 1
        postalCode:
          type: string
          description: Address postal code
          maxLength: 15
          minLength: 1
        city:
          type: string
          description: Address city
          maxLength: 50
          minLength: 1
        state:
          type: string
          description: Address state
          maxLength: 30
          minLength: 1
        countryCode:
          type: string
          format: ISO 3166-1 alpha-2
          description: The supported ISO 3166-1 alpha-2 country code
          minLength: 1
      required:
        - address1
        - city
        - countryCode
        - postalCode
    PaymentsSocialNetworkAccount:
      allOf:
        - $ref: '#/components/schemas/PaymentsRecipientAccount'
        - type: object
          properties:
            type:
              type: string
              enum:
                - socialNetwork
            socialNetworkReference:
              type: string
              description: A reference identifying recipient's social network account.
              maxLength: 50
              minLength: 1
              pattern: ^(?!\s*$)[a-zA-Z0-9\s@!£*#$)(+\-_=.,/;:'"]*$
      required:
        - socialNetworkReference
        - type
    PaymentsSubMerchant:
      type: object
      properties:
        name:
          type: string
          description: >-
            The name of your subMerchant's company.<br><br>Also used for __3DS
            authentication__ to display the merchant name during the
            authentication process.
          example: Merchant Plc
          maxLength: 25
          minLength: 1
          pattern: ^(?!\s*$)[A-Za-z0-9 ]*$
        reference:
          type: string
          description: Unique merchant reference.
          example: '123456789012345'
          maxLength: 15
          minLength: 1
          pattern: '[a-zA-Z0-9]*$'
        address:
          $ref: '#/components/schemas/PaymentsSubMerchantAddress'
          description: Contains the subMerchant address information.
        phoneNumber:
          type: string
          description: Phone number of your subMerchant's company.
          example: 987-65-4321
          maxLength: 20
          minLength: 4
          pattern: ^(?!\s*$)[0-9\s()+\-/.x]*$
        taxReference:
          type: string
          description: Tax Reference of your subMerchant's company.
          example: 987-65-4321
          maxLength: 20
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s-]*$
        email:
          type: string
          description: Email address of your subMerchant's company.
          example: email@example.com
          maxLength: 40
          minLength: 1
          pattern: ^.+@.+$
        url:
          type: string
          example: url.example.com
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9@!£*#$)(+\-_=.,/;:]*$
      required:
        - address
        - name
        - reference
    PaymentsSubMerchantAddress:
      type: object
      properties:
        postalCode:
          type: string
          description: Post code/Zip code of your subMerchant's company.
          example: SW1 1AA
          maxLength: 10
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        street:
          type: string
          description: Street name of your subMerchant's company.
          example: 221B Baker Street
          maxLength: 50
          minLength: 1
          pattern: ^(?!\s*$)[A-Za-z0-9\s]*$
        city:
          type: string
          description: City of your subMerchant's company.
          example: London
          maxLength: 13
          minLength: 1
          pattern: ^(?!\s*$)[A-Za-z\s-]*$
        state:
          type: string
          description: State of your subMerchant's company.
          example: GB
          maxLength: 3
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        countryCode:
          type: string
          description: >-
            Country code of your subMerchant's company in [ISO 3166-1 Alpha-2
            format](/products/reference/supported-countries-currencies#iso-country-codes).
          example: GB
          maxLength: 2
          minLength: 2
      required:
        - city
        - countryCode
        - postalCode
        - street
    PaymentsSubscriptionCustomerAgreement:
      allOf:
        - $ref: '#/components/schemas/PaymentsCustomerAgreement'
        - type: object
          properties:
            type:
              type: string
              enum:
                - subscription
            storedCardUsage:
              type: string
              description: ' Set to `first` to store a card or `subsequent` to use a previously stored card. '
              enum:
                - first
                - subsequent
            schemeReference:
              type: string
              description: >-
                Optional field available only for `subsequent` storedCardUsage.
                Unique reference provided by card schemes used to link the
                `first` and `subsequent` payments. If a Worldpay token was
                created as part of the first payment, this value is bundled with
                the token and does not need to be provided again. If you manage
                multiple agreements for a single cardholder using a token,
                please use the `schemeReference` returned to you. This allows
                you to distinguish and manage each separate agreement
                appropriately.
              example: MCCOLXT1C0104
              maxLength: 56
              minLength: 1
              pattern: ^[A-Za-z0-9]*$
      required:
        - storedCardUsage
        - type
    PaymentsThreeDS:
      type: object
      description: >-
        An object containing 3DS authentication preferences.


        Read more on how to set it up under our [__3DS
        Authentication__](/products/payments/enable-features/3ds-authentication)
        guide.
      discriminator:
        propertyName: type
        mapping:
          integrated: '#/components/schemas/PaymentsIntegratedThreeDS'
          external: '#/components/schemas/PaymentsExternalThreeDS'
      properties:
        type:
          type: string
      required:
        - type
    PaymentsTransferAddress:
      type: object
      properties:
        address1:
          type: string
          description: Must be supplied if `city` is provided.
          maxLength: 80
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        address2:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        city:
          type: string
          description: Must be supplied if `address1` is provided.
          maxLength: 50
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        postalCode:
          type: string
          maxLength: 10
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        state:
          type: string
          description: 1-3 alphanumeric characters and spaces.
          maxLength: 3
          minLength: 1
          pattern: ^(?!\s*$)[a-zA-Z0-9\s]*$
        countryCode:
          type: string
          format: ISO 3166-1 alpha-2
          description: >-
            Country code in [ISO 3166-1 Alpha-2
            format](/products/reference/supported-countries-currencies#iso-country-codes).
          minLength: 1
      required:
        - countryCode
    PaymentsUnscheduledCustomerAgreement:
      allOf:
        - $ref: '#/components/schemas/PaymentsCustomerAgreement'
        - type: object
          properties:
            type:
              type: string
              enum:
                - unscheduled
            schemeReference:
              type: string
              description: >-
                Unique reference provided by card schemes used to link the
                `first` and `subsequent` payments. This value is bundled with
                the Worldpay token if created as part of the `first` payment and
                therefore not required here as well. If you manage multiple
                agreements for a single cardholder using a token, please use the
                `schemeReference` returned to you. This allows you to
                distinguish and manage each separate agreement appropriately.
              example: MCCOLXT1C0104
              maxLength: 56
              minLength: 1
              pattern: ^[A-Za-z0-9]*$
      required:
        - type
    PaymentsWalletAccount:
      allOf:
        - $ref: '#/components/schemas/PaymentsRecipientAccount'
        - type: object
          properties:
            type:
              type: string
              enum:
                - wallet
                - storedValueWallet
                - stagedDigitalWallet
                - merchantWallet
            walletReference:
              type: string
              description: A reference identifying the destination wallet.
              maxLength: 50
              minLength: 1
              pattern: ^(?!\s*$)[a-zA-Z0-9\s@!£*#$)(+\-_=.,/;:'"]*$
      required:
        - type
        - walletReference
    Routing:
      type: object
      description: An object containing specific routing preferences.
      properties:
        preferredCardBrand:
          type: string
          description: >-
            Specifies your customer's preferred card brand to be used for the
            transaction using a co-badged card.
          enum:
            - visa
            - mastercard
            - maestro
            - amex
            - cartesBancaires
            - diners
            - dankort
            - jcb
            - discover
            - elo
            - eftposAU
    SessionPaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              enum:
                - checkout
            sessionHref:
              type: string
              description: >-

                An http address that contains your Checkout session providing
                the card details.
            cardHolderName:
              type: string
              description: >-


                The name on your customer's card. Required if 
                instruction.tokenCreation is present. However we recommend that
                you supply this to improve authentication rates.
              example: Sherlock Holmes
              maxLength: 255
              minLength: 1
            billingAddress:
              $ref: '#/components/schemas/PaymentsBillingAddress'
            routing:
              $ref: '#/components/schemas/Routing'
      required:
        - sessionHref
        - type
    SessionsDelegatePaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              enum:
                - delegate
            sessionHref:
              type: string
              description: >-

                An http address that contains your Delegate token providing the
                card details.
      required:
        - sessionHref
        - type
    Settlement:
      type: object
      description: >-
        Automatically settle a payment following authorization. If any of the
        AVS/CVC response riskFactors are marked as `notMatched` the payment will
        be `sentForCancellation` automatically.


        Read more on how to set it up under our [__Auto
        Settlement__](/products/payments/enable-features/auto-settlement) guide.
      properties:
        auto:
          type: boolean
        cancelOn:
          $ref: '#/components/schemas/Cancellation'
          description: >-
            Configuration for when a payment is `sentForCancellation`
            automatically.
      required:
        - auto
    Shipping:
      type: object
      description: |-
        Object containing all data related to how the order will be shipped.

        __Used for:__ 3DS Authentication | Risk assessment
      properties:
        method:
          type: string
          description: The shipping method used.
          enum:
            - billingAddress
            - verifiedAddress
            - otherAddress
            - store
            - digital
            - unshippedTickets
            - other
        timeFrame:
          type: string
          enum:
            - electronic
            - sameDay
            - nextDay
            - twoDaysPlus
        email:
          type: string
          description: The email address used for an electronic delivery.
          maxLength: 128
          minLength: 1
          pattern: ^.+@.+$
        phone:
          type: string
          description: The phone number used for delivery.
          maxLength: 20
          minLength: 4
          pattern: ^[0-9]*$
        firstName:
          type: string
          description: First name used on the shipping address.
          maxLength: 22
          minLength: 1
        lastName:
          type: string
          description: Last name used on the shipping address.
          maxLength: 22
          minLength: 1
        address:
          $ref: '#/components/schemas/PaymentsShippingAddress'
    TokenCreation:
      type: object
      description: >-
        Use this object if you want to create a token after the payment. Can
        only be used with paymentInstrument.type: card/plain & checkout.
      properties:
        type:
          type: string
          enum:
            - worldpay
        namespace:
          type: string
          description: ' A namespace is used to group up to 16 cards, e.g. for one customer. A card can exist in more than one namespace. '
          maxLength: 64
          minLength: 1
          pattern: ^[^_][^ &<]*$
        description:
          type: string
          description: ' A description of your token. If not supplied, a default description is created for you. '
          maxLength: 255
          minLength: 1
          pattern: ^[^&<]*$
      required:
        - type
    TokenPaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              enum:
                - token
            tokenId:
              type: string
              description: >-
                Worldpay's internal identifier for a token. If supplied, must be
                between 15 and 21 characters, must consist of digits and
                upper-case characters excluding 'I' and 'O'. __Note:__ Provide a
                value in `tokenId` or `href`, never both.
              example: 9902480679618050000
              maxLength: 21
              minLength: 15
              pattern: ^[0-9A-HJ-NP-Z]*$
            href:
              type: string
              description: >-
                An http address that contains your link to an Access Token.
                __Note:__ Provide a value in `href` or `tokenId`, never both.
              example: >-
                https://try.access.worldpay.com/tokens/eyJrIjoxLCJkIjoiNjQxbUsw...
            namespace:
              type: string
              description: A reference to group up to 16 cards, e.g. for one customer.
              maxLength: 64
              minLength: 1
              pattern: ^[^_][^ &<]*$
            cvc:
              type: string
              description: >-


                CVC is a unique set of 3 or 4 numbers on the back of the card.
                Our API checks to see if the CVC supplied matches the CVC held
                by the issuing bank.
              example: '123'
              maxLength: 4
              minLength: 3
              pattern: '[0-9]*$'
            cvcSessionHref:
              type: string
              description: >-


                Href to the Checkout session providing the Card Verification
                Code (CVC).__Note:__ Provide a value in `cvcSessionHref` or
                `cvc`, never both.
              example: >-
                https://try.access.worldpay.com/sessions/eyJrIjoxLCJkIjoiNjQxbUsw...
            routing:
              $ref: '#/components/schemas/Routing'
      required:
        - type
    TransactionHistory:
      type: object
      properties:
        attemptsLastDay:
          type: integer
          format: int32
          description: ' Number of transactions (successful or abandoned) for this cardholder account within the last 24 hours. '
        attemptsLastYear:
          type: integer
          format: int32
          description: ' Number of transactions (successful or abandoned) for this cardholder account within the last year. '
        completedLastSixMonths:
          type: integer
          format: int32
          description: ' Number of purchases with this customer account during the previous six months. '
        addCardsLastDay:
          type: integer
          format: int32
          description: Number of attempts to add a card in the last 24hrs.
        shippingAddressFirstUsedAt:
          type: string
          description: ' When the shipping address used for the transaction was first used. '
    DeviceDataCollection:
      type: object
      properties:
        jwt:
          type: string
          description: ' A digitally signed token that contains additional details required for DDC. '
          example: >-


            eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJPcmdVbml0SWQiOiI2NjAzMDA3YWJlMjMxZTM1ZTNmNTRjODkiLCJpc3MiOiI2NjAzMDA3YTE2ZGQ5YTdlNmEwMzM0MDciLCJleHAiOjE3MTIyNDg3MTIsImlhdCI6MTcxMjI0ODExMiwianRpIjoiZjdjZGVhZWUtMTY4MS00NjlhLTgxZmEtMzBkY2MyOTYzODA3In0.T1a6hOCPVVsQmcCKU3eczwmxlHoWK83tUqIJ_VG4fwc
          maxLength: 2048
          minLength: 1
        url:
          type: string
          description: ' A `POST` action on the DDC form. Used to redirect to the issuers DDC page. This URL can could change so should not be hardcoded. '
          example: https://centinelapistag.cardinalcommerce.com/V1/Cruise/Collect
          maxLength: 2048
          minLength: 1
        bin:
          type: string
          description: ' First six digits of the card number (Bank Identification Number), used as part of DDC. '
          example: '400000'
          maxLength: 6
          minLength: 6
      required:
        - bin
        - jwt
        - url
    DeviceDataRequiredActionList:
      type: object
      properties:
        supply3dsDeviceData:
          $ref: '#/components/schemas/PaymentsActionSupply3dsDeviceData'
    DeviceDataRequiredResponse:
      type: object
      properties:
        outcome:
          type: string
        transactionReference:
          type: string
          description: ' A unique reference generated by you that is used to identify a payment throughout its lifecycle. '
          maxLength: 64
          minLength: 1
          pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
        deviceDataCollection:
          $ref: '#/components/schemas/DeviceDataCollection'
        _actions:
          $ref: '#/components/schemas/DeviceDataRequiredActionList'
    FraudHighRiskResponse:
      type: object
      properties:
        outcome:
          type: string
        transactionReference:
          type: string
          description: ' A unique reference generated by you that is used to identify a payment throughout its lifecycle. '
          maxLength: 64
          minLength: 1
          pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
        score:
          type: number
          format: double
          description: ' Percentage assessment score for the transaction. Higher the value the greater the assessed risk. The outcome value is based on the thresholds configured using this score. '
          maximum: 100
          minimum: 0
        reason:
          type: array
