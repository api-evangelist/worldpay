          type: string
          description: Address line 1
          maxLength: 80
          minLength: 1
        address2:
          type: string
          description: Address line 2
          maxLength: 80
          minLength: 1
        address3:
          type: string
          description: Address line 3
          maxLength: 80
          minLength: 1
        postalCode:
          type: string
