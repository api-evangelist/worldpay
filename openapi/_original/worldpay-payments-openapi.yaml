    QueryActionList:
      type: object
      properties:
        cancelPayment:
          $ref: '#/components/schemas/PaymentsActionCancel'
        partiallySettlePayment:
          $ref: '#/components/schemas/PaymentsActionPartialSettle'
        settlePayment:
          $ref: '#/components/schemas/PaymentsActionSettle'
        refundPayment:
          $ref: '#/components/schemas/PaymentsActionRefund'
        partiallyRefundPayment:
          $ref: '#/components/schemas/PaymentsActionPartialRefund'
        reversePayment:
          $ref: '#/components/schemas/PaymentsActionReverse'
    QueryEventsResponse:
      type: object
      properties:
        lastEvent:
          type: string
          description: >-

            The lastEvent field represents the latest high‑level outcome of a
            payment in our Payments API. It reflects the result of the most
            recent payment command (for example authorization, settlement, or
            refund) rather than the raw lifecycle event stream. 


            We return it in:
              - `GET` requests made via our Payments API
              -  responses from our Payment Queries API when querying historical payments
                        
            {% admonition type="info" %}

            Our Payment Queries API exposes lower‑level lifecycle events
            (`eventName`). We map these to a single Payments API `lastEvent`
            value.

            For the full mapping between our Payment Queries API events and
            Payments API `lastEvent` values, see [lastEvent mapping in the
            Payment Queries API
            documentation](/products/payment-queries/query-archive#lastevent-mapping).

            {% /admonition %}
          enum:
            - Authorized
            - Refused
            - Sent for Settlement
            - Sent for Refund
            - Sent for Cancellation
            - Refund failed
            - Settlement failed
            - Settled
            - Refunded
            - Error
            - Expired
          x-enumDescriptions:
            Authorized: >-
              The payment has been approved and the funds have been reserved in
              your customer's account.
            Sent for Refund: >-
              A request has been made to send funds back to your customer's
              account.
            Error: >-
              The payment wasn't completed. You may want to reattempt the
              payment.
            Expired: >-
              The authorization validity period ended before a settlement or
              cancel request was made.
            Settlement failed: >-
              A settlement request couldn't be processed. Funds have not been
              transferred to your Worldpay account.
            Refused: Your payment request has been declined.
            Refund failed: >-
              A refund request couldn't be processed and the funds were returned
              to your account.
            Sent for Cancellation: >-
              A request has been made to cancel the payment without sending it
              for settlement.
            Settled: >-
              We have received the funds and are preparing to transfer them to
              your bank account. This event is only available in certain use
              cases.
            Sent for Settlement: >-
              A request has been made to move the reserved funds in your
              customer's account and transfer them to your Worldpay account.
            Refunded: >-
              The card issuer has received the refund request and they will
              return the funds to your customer's account. This event is only
              available in certain use cases.
        _actions:
          $ref: '#/components/schemas/QueryActionList'
