    Customer:
      type: object
      properties:
        customerId:
          type: string
          description: |-
            Unique identifier used by the ecommerce system for the customer.

            __Used for:__ Risk assessment
          maxLength: 128
          minLength: 1
        firstName:
          type: string
          description: |-
            Customer's first name.

            __Used for:__ 3DS authentication | Risk assessment
          maxLength: 22
          minLength: 1
        lastName:
          type: string
          description: |-
            Customer's last name.

            __Used for:__ 3DS authentication | Risk assessment
          maxLength: 22
          minLength: 1
        phone:
          type: string
          description: >-
            Customer's phone number.


            __Used for:__ 3DS authentication | Risk assessment | Card
            authorization
          maxLength: 20
          minLength: 4
