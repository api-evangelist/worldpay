            - '4'
            - '8'
            - '15'
            - '16'
            - '24'
            - '32'
            - '48'
        browserScreenHeight:
          type: integer
          format: int32
          description: Defines the pixel height of the customers browser.
        browserScreenWidth:
          type: integer
          format: int32
          description: Defines the pixel width of the customers browser.
        timeZone:
          type: string
          description: |2-
             Time zone offset in minutes between UTC and your customer's browser local time.  
            Example time zone offset values in minutes:  
            If UTC -5 hours:  
            `300`  
            `+300`  
            If UTC +5 hours:  
            `-300`  
             
          pattern: ^[+-]?\d{1,4}$
        browserJavascriptEnabled:
          type: boolean
          description: Defines whether Javascript is enabled on your customers browser.
        channel:
          type: string
          description: >-
            Determines the channel that the transaction came through. `native`
            should only be set if using the Cardinal 3DS SDK (iOS/Android)
          enum:
            - browser
            - native
      required:
        - acceptHeader
        - userAgentHeader
    Exemption:
      type: object
      description: >-
        An object used to request or specify an SCA Exemption. 


        Read more on how to set it up under our [__SCA
        Exemptions__](/products/payments/enable-features/sca-exemptions) guide.
      properties:
        type:
          type: string
          description: >-
            Ask for an SCA exemption recommendation directly from Worldpay
            (integrated) or use a 3rd party TRA solution.<br>__Note:__ Only type
            `integrated` is supported for now.
          enum:
            - integrated
        mode:
          type: string
          description: Specify which transactions to request SCA Exemptions for.
          enum:
            - always
        capability:
          type: string
          description: >-
            Indicates whether the exemption requested from Worldpay can return a
            placement of authorization (payment) and/or authentication (3DS).
          enum:
            - authorizationAndAuthentication
            - authorizationOnly
            - authenticationOnly
          example: authenticationOnly
          x-enumDescriptions:
            authenticationOnly: >-
              The SCA Exemptions service can only return a `placement` of
              `authentication`.
            authorizationOnly: >-
              The SCA Exemptions service can only return a `placement` of
              `authorization`.
            authorizationAndAuthentication: >-
              The SCA Exemptions service can return either a `placement` of
              `authorization` or `authentication`.
        request:
          $ref: '#/components/schemas/PaymentsExemptionRequest'
      required:
        - capability
        - mode
        - type
    InstallmentPlan:
      type: object
      properties:
        numberOfInstallments:
