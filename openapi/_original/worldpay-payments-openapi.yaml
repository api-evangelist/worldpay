    PaymentsBankAccount:
      allOf:
        - $ref: '#/components/schemas/PaymentsRecipientAccount'
        - type: object
          properties:
            type:
              type: string
              enum:
                - bankAccount
            identifierType:
              type: string
              enum:
                - iban
                - swift
                - routingNumber
                - accountNumber
            iban:
              type: string
              description: >-
                The International Bank Account Number (IBAN) of the recipient.
                Required if `identifierType` is `iban`
              example: IE12BOFI90000112345678
              maxLength: 34
              minLength: 1
              pattern: ^[A-Za-z0-9]*$
            accountNumber:
              type: string
              description: >-
                The account number of the recipient. Required if
                `identifierType` is `routingNumber`, `swift` or `accountNumber`
              example: '01234567'
              maxLength: 39
              minLength: 1
              pattern: ^(?!\s*$)[a-zA-Z0-9\s@!£*#$)(\-_=.,/;:'"]*$
            swiftBic:
              type: string
              description: >-
                The SWIFT Bank Identification Code (BIC) of the recipient.
                Required if `identifierType` is `swift`. Must be either 8 or 11
                alphanumeric characters.
              example: BEASUS33xxx
              maxLength: 11
              minLength: 8
              pattern: ^[A-Za-z0-9]*$
            routingNumber:
              type: string
              description: >-
                The ABA (American Bankers Association) Routing Transit Number
                (RTN). Identifies the Financial Insititution of the recipient's
                account. Required if `identifierType` is `routingNumber`. Must
                be 9 numeric characters.
              example: '111000025'
              maxLength: 9
              minLength: 9
              pattern: '[0-9]*$'
      required:
        - identifierType
        - type
    PaymentsCardAccount:
      allOf:
        - $ref: '#/components/schemas/PaymentsRecipientAccount'
        - type: object
          properties:
            type:
              type: string
              enum:
                - card
            cardNumber:
              type: string
              description: Recipient's card number.
              maxLength: 19
              minLength: 12
              pattern: ^[0-9]+$
      required:
        - cardNumber
        - type
    PaymentsCardInstruction:
      properties:
        method:
          type: string
          description: The method of instruction.
          enum:
            - card
        paymentInstrument:
          discriminator:
            propertyName: type
            mapping:
              plain: '#/components/schemas/PaymentsCardPlainPaymentInstrument'
              token: '#/components/schemas/TokenPaymentInstrument'
              checkout: '#/components/schemas/SessionPaymentInstrument'
              delegate: '#/components/schemas/SessionsDelegatePaymentInstrument'
              networkToken: '#/components/schemas/PaymentsNetworkTokenPaymentInstrument'
          properties:
            type:
              type: string
              description: The type of instrument.
          required:
            - type
        narrative:
          $ref: '#/components/schemas/Narrative'
        tokenCreation:
          $ref: '#/components/schemas/TokenCreation'
        value:
          $ref: '#/components/schemas/Value'
        debtRepayment:
          type: boolean
          description: >-
            A flag which identifies a payment as being for the purpose of
            repaying a debt.
        fraud:
          $ref: '#/components/schemas/PaymentsFraud'
        threeDS:
          $ref: '#/components/schemas/PaymentsThreeDS'
        exemption:
          $ref: '#/components/schemas/Exemption'
        settlement:
          $ref: '#/components/schemas/Settlement'
        customer:
          $ref: '#/components/schemas/Customer'
        shipping:
          $ref: '#/components/schemas/Shipping'
        customerAgreement:
          $ref: '#/components/schemas/PaymentsCustomerAgreement'
        recipient:
          $ref: '#/components/schemas/PaymentsRecipient'
        consumerBillPayment:
          type: boolean
          description: >-
            An attribute that identifies a bill payment paid by providers on
            behalf of consumers. If you are registered with Visa as a Consumer
            of the Bill Payment Service (CBPS), you must set this to `true` for
            any payments associated with the CBPS.
        fundsTransfer:
          $ref: '#/components/schemas/PaymentsFundsTransfer'
        requestAccountUpdater:
          type: boolean
          description: >-
            Allows you to request a real-time account update (Visa cards only)
            when using a previously stored card. You can only use this on
            subsequent card requests.
      required:
        - method
        - narrative
        - paymentInstrument
        - value
    PaymentsCardOnFileCustomerAgreement:
      allOf:
        - $ref: '#/components/schemas/PaymentsCustomerAgreement'
        - type: object
          properties:
            type:
              type: string
              enum:
                - cardOnFile
            storedCardUsage:
              type: string
              description: ' Set to `first` to store a card or `subsequent` to use a previously stored card. '
              enum:
                - first
                - subsequent
      required:
        - storedCardUsage
        - type
    PaymentsCardPlainPaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              enum:
                - plain
            cardNumber:
              type: string
              description: Customer's card number.
              example: '4000000000001091'
              maxLength: 19
              minLength: 12
              pattern: ^[0-9]+$
            cardHolderName:
              type: string
              description: >-


                The name on your customer's card. Required if 
                instruction.tokenCreation is present. However we recommend that
                you supply this to improve authentication rates.
              example: Sherlock Holmes
              maxLength: 255
              minLength: 1
            expiryDate:
              $ref: '#/components/schemas/ExpiryDate'
            cvc:
              type: string
              description: >-


                CVC is a unique set of 3 or 4 numbers on the back of the card.
                Our API checks to see if the CVC supplied matches the CVC held
                by the issuing bank.
              example: '123'
              maxLength: 4
              minLength: 3
              pattern: '[0-9]*$'
            billingAddress:
              $ref: '#/components/schemas/PaymentsBillingAddress'
            routing:
              $ref: '#/components/schemas/Routing'
      required:
        - cardNumber
        - expiryDate
        - type
    PaymentsCustomerAgreement:
      type: object
      description: ' Contains specific customer agreements for the transaction. '
      discriminator:
        propertyName: type
        mapping:
          cardOnFile: '#/components/schemas/PaymentsCardOnFileCustomerAgreement'
          subscription: '#/components/schemas/PaymentsSubscriptionCustomerAgreement'
          installment: '#/components/schemas/PaymentsInstallmentCustomerAgreement'
          unscheduled: '#/components/schemas/PaymentsUnscheduledCustomerAgreement'
      properties:
        type:
          type: string
          description: The processing arrangement agreed with your customer.
      required:
        - type
    PaymentsDecryptedPaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              enum:
                - decrypted
            number:
              type: string
              maxLength: 19
              minLength: 12
              pattern: ^\d+$
            cryptogram:
              type: string
              example: BLIYQ4EA/wLF4/hK9ABFMAABAAA=
              maxLength: 40
              minLength: 1
            eci:
              type: string
              description: Electronic Commerce Indicator.
              pattern: ^\d{2}$
            expiryDate:
              $ref: '#/components/schemas/ExpiryDate'
            billingAddress:
              $ref: '#/components/schemas/PaymentsBillingAddress'
      required:
