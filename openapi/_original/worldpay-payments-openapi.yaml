            accountUpdaterMessage:
              type: string
              description: Details on the type of payment instrument update.
              enum:
                - The merchant is not registered in the update program
                - The account number was changed
                - The account was closed
                - The expiry was changed
                - The issuing bank does not participate in the update program
                - Contact the cardholder for updated information
                - No match found
                - No changes found
              example: The account number was changed
              x-enumDescriptions:
                The issuing bank does not participate in the update program: >-
                  Returned for Real Time Account Updater only. It is not known
                  whether an account update is available.
                Contact the cardholder for updated information: >-
                  A match was found but you may need to contact the cardholder
                  for updated card details. This could be due to cardholder
                  opt-out or other reasons.
                The account number was changed: A new card has been issued with a change in the card number.
                No changes found: No changes to the card account were found.
                The account was closed: >-
                  The account is closed and the card is no longer valid. Ask
                  your customer for an alternative payment method.
                The merchant is not registered in the update program: >-
                  Returned for Real Time Account Updater only. Contact Worldpay
                  to enroll in the service.
                The expiry was changed: >-
                  A new card has been issued with an updated expiry date. In
                  most cases the card number remains unchanged.
                No match found: >-
                  The BIN range is enrolled for account updates, but no match
                  was found for the card account. One reason for this may be
                  that the card issuer has recently changed.
            expiryDate:
              $ref: '#/components/schemas/ExpiryDate'
            cardBrand:
              type: string
              description: >-
                The brand of the updated card. In rare circumstances a card may
                be reissued under a different brand.
            fundingType:
              type: string
              description: How the card is funded.
            countryCode:
              type: string
      discriminator:
        propertyName: type
      required:
        - type
    PaymentsResponsePaymentInstrument:
      type: object
      description: Details of the paymentInstrument used.
      properties:
        type:
          type: string
        cardBin:
          type: string
          description: >-
            The card BIN (Bank Identification Number) is the first six or eight
            digits of the card number, and can be used to identify the card
            issuer, the card brand(s) (eg Visa, Cartes Bancaires) and the
            country. Card BINs are used to route transactions, check card
            capabilities and in fraud assessments.
          example: '444433'
          pattern: ^[0-9*]+$
        lastFour:
          type: string
          description: >-
            The last four digits of the card. Some characters may be obfuscated
            with a `*` if the PAN length is less than 16 characters.
          example: '1111'
          pattern: ^[0-9*]+$
        countryCode:
          type: string
          description: >-
            The [ISO 3166-1 Alpha-2
            format](/products/reference/supported-countries-currencies#iso-country-codes)
            country code that the card was issued in. May return `N/A` where the
            country is unknown.
          example: GB
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
        expiryDate:
          $ref: '#/components/schemas/ExpiryDate'
        cardBrand:
          type: string
          description: >-
            The card brand that the transaction was processed with. Sometimes
            referred to as the network or scheme.
          enum:
            - visa
            - mastercard
            - amex
            - maestro
            - visaElectron
            - diners
            - discover
            - jcb
            - argencard
            - cabal
            - carteBleue
            - cartesBancaires
            - carnet
            - cencosud
            - coopeplus
            - credimas
            - dankort
            - elo
            - eftposAU
            - hipercard
            - italcred
            - naranja
            - nativa
            - nevada
            - nexo
            - tarjeta
            - unionPay
        fundingType:
          type: string
          description: How the card is funded.
          enum:
            - credit
            - debit
            - prepaid
            - chargeCard
            - deferredDebit
            - unknown
        category:
          type: string
          description: >-
            Whether the card is classed as a consumer card or a card for
            commercial use.
          enum:
            - commercial
            - consumer
        issuerName:
          type: string
          description: The name of the card issuer.
          example: AN ISSUING BANK LTD
        paymentAccountReference:
          type: string
          description: >-
            The Payment Account Reference (PAR) is a non-financial reference
            that uniquely identifies the underlying cardholder account. This
            allows you to correlate payments made from the same account with
            differing instruments, where the same account funds the transaction.
            You cannot use a PAR to initiate a payment.
          example: Q1HJZ28RKA1EBL470G9XYG90R5D3E
    PaymentsUpdatedPaymentInstrument:
      type: object
      discriminator:
        propertyName: type
        mapping:
          card/plain: '#/components/schemas/PaymentsPlainUpdatedPaymentInstrument'
          card/plain+masked: '#/components/schemas/PaymentsPlainMaskedUpdatedPaymentInstrument'
      properties:
        type:
          type: string
          description: The type of updated instrument.
      required:
        - type
    RiskFactor:
      type: object
      properties:
        risk:
          type: string
          enum:
            - notChecked
            - notMatched
            - notSupplied
            - verificationFailed
        detail:
          type: string
          enum:
            - address
            - postcode
        type:
          type: string
          enum:
            - avs
            - cvc
            - riskProfile
    ThreeDS:
      type: object
      properties:
        type:
          type: string
          description: >-
            Used to describe if the authentication was done by a third party or
            internally.
          enum:
            - external
            - integrated
        outcome:
          type: string
          description: >-
            Indicates the outcome of the authentication request. `authenticated`
            indicates a successful authentication. {% admonition type="warning"
            name="Note" %} The `authenticationOutage` outcome is not enabled by
            default. Please contact your Worldpay Implementation Manager if you
            would like to be set up to receive `authenticationOutage` responses.
            By applying the authentication outage exemption the issuer is more
            likely to authorize the payment, but it will not be eligible for
            liability shift.{% /admonition %}
          enum:
            - authenticated
            - authenticationOutage
        issuerResponse:
          type: string
          description: >-
            If the issuer decides to challenge the customer or proceed.
            (frictionless)
          enum:
            - frictionless
            - challenged
        version:
          type: string
          description: The version of 3DS used to process the transaction.
          maxLength: 10
          minLength: 1
        eci:
          type: string
          description: >-
            Electronic Commerce Indicator (ECI). Indicates the outcome of the
            3DS authentication.


            | ECI | Meaning |

            | --- | --- |

            | 02 or 05 | Fully authenticated transaction

            | 01 or 06 | Attempted authentication transaction

            | 00 or 07 | Non 3-D Secure transaction


            | Scheme | Value |

            | --- | --- |

            | Mastercard | 02, 01, 00 |

            | Visa | 05, 06, 07 |

            | Amex | 05, 06, 07 |

            | JCB | 05, 06, 07 |

            | Diners | 05, 06, 07 |
          maxLength: 2
          minLength: 1
        acsTransactionId:
          type: string
          description: >-
            An identifier assigned by the Access Control Server (ACS) to
            identify a single transaction. Used primarily for Mastercard 3RI
            subsequent transactions to link the subsequent transaction back to a
            previous cardholder authentication. Can be disregarded unless
            otherwise needed.
          maxLength: 36
          minLength: 1
        dsTransactionId:
          type: string
          description: >-
            Directory server transaction Id, if provided should be used in the
            payment authorization authentication object.
          maxLength: 64
          minLength: 1
        status:
          type: string
          description: >
            Indicates the outcome of the authentication or verification request.

            - `Y` - Successful authentication

            - `N` - Failed authentication

            - `U` - Unable to complete authentication

            - `A` - Successful attempts authentication

            - `C` - Challenged authentication

            - `R` - Authentication rejected (merchant _must not_ submit for
            authorization)

            - `I` - Exemption acknowledged
          maxLength: 2
          minLength: 1
        challengePreference:
          type: string
          description: >-
            Indicates the preferred challenge behavior. __Returned for Cartes
            Bancaires authentications only__ and must be applied in the
            following authorization request.

            - `noPreference`

            - `noChallengeRequested`

            - `challengeRequested`

            - `challengeMandated`

            - `noChallengeRequestedTRAPerformed`
          maxLength: 64
          minLength: 1
    Token:
      type: object
      description: An object including the token details you have asked us to create.
      properties:
        href:
          type: string
          description: The token href you can save for use in future payment requests.
          example: >-
            https://try.access.worldpay.com/tokens/eyJrIjoxLCJkIjoiUW5rZHBXZDZ1MzBBY0I0MTVJQUdPeGE3ZkFobE1lTjJyYk05eDZxQUJ2RT0ifQ
        tokenId:
