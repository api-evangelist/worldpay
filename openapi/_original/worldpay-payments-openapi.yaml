      properties:
        line1:
          type: string
          description: line1 is used to provide basic details about the merchant.
          maxLength: 24
          minLength: 1
          pattern: ^[a-zA-Z0-9 ,./-]*$
        line2:
          type: string
          description: ' line2 is used for additional context about the payment or merchant. E.g. Order number or Merchant phone number. '
          maxLength: 24
          minLength: 1
          pattern: ^[a-zA-Z0-9 ,./-]*$
      required:
        - line1
    PaymentRequest:
      properties:
        transactionReference:
          type: string
          description: ' A unique reference generated by you that is used to identify a payment throughout its lifecycle. '
          maxLength: 64
          minLength: 1
          pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
        orderReference:
          type: string
          description: >-
            A reference that you can apply to one or more payments according to
            your business needs. You may reuse the same reference across
            multiple payments, for example where:

            - the total amount for a single order is split across multiple
            payments

            - you use a single reference for each payment in a recurring
            agreement or split shipment scenario
          maxLength: 64
          minLength: 1
          pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~/+]*$
        merchant:
