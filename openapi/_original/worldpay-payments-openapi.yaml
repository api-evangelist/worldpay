              type: string
              description: The updated card BIN (Bank Identification Number).
              example: '444433'
            lastFour:
              type: string
              description: >-
                The four digits of the updated card. Some characters may be
                obfuscated with a * if the PAN length is less than 16
                characters.
              example: '1111'
            accountUpdaterMessage:
              type: string
              description: Details on the type of payment instrument update.
              enum:
                - The merchant is not registered in the update program
                - The account number was changed
                - The account was closed
                - The expiry was changed
                - The issuing bank does not participate in the update program
                - Contact the cardholder for updated information
                - No match found
                - No changes found
              example: The account number was changed
              x-enumDescriptions:
                The issuing bank does not participate in the update program: >-
                  Returned for Real Time Account Updater only. It is not known
                  whether an account update is available.
                Contact the cardholder for updated information: >-
                  A match was found but you may need to contact the cardholder
                  for updated card details. This could be due to cardholder
                  opt-out or other reasons.
                The account number was changed: A new card has been issued with a change in the card number.
                No changes found: No changes to the card account were found.
                The account was closed: >-
                  The account is closed and the card is no longer valid. Ask
                  your customer for an alternative payment method.
                The merchant is not registered in the update program: >-
                  Returned for Real Time Account Updater only. Contact Worldpay
                  to enroll in the service.
                The expiry was changed: >-
                  A new card has been issued with an updated expiry date. In
                  most cases the card number remains unchanged.
                No match found: >-
                  The BIN range is enrolled for account updates, but no match
                  was found for the card account. One reason for this may be
                  that the card issuer has recently changed.
            expiryDate:
              $ref: '#/components/schemas/ExpiryDate'
            cardBrand:
              type: string
              description: >-
                The brand of the updated card. In rare circumstances a card may
                be reissued under a different brand.
            fundingType:
              type: string
              description: How the card is funded.
            countryCode:
              type: string
      discriminator:
        propertyName: type
      required:
        - type
    PaymentsPlainUpdatedPaymentInstrument:
      allOf:
