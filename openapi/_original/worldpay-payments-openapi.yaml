        - name: linkData
          in: path
          required: true
          schema:
            type: string
        - name: WP-Api-Version
          in: header
          description: The API version
          required: true
          schema:
            type: string
            description: The API version
            enum:
              - '2024-06-01'
            example: '2024-06-01'
          example: '2024-06-01'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse201'
              examples:
                authorized:
                  $ref: '#/components/examples/authorized-3ds-challenged-201'
                refused:
                  $ref: '#/components/examples/refused-201'
                3dsUnavailable:
                  $ref: '#/components/examples/3ds-unavailable-201'
                3dsAuthenticationFailed:
                  $ref: '#/components/examples/3ds-authentication-failed-201'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse202'
              examples:
                sentForSettlement:
                  $ref: '#/components/examples/sent-for-settlement-3ds-challenged-202'
                sentForCancellation:
                  $ref: '#/components/examples/sent-for-cancellation-202'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                Bad request:
                  $ref: '#/components/examples/400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  $ref: '#/components/examples/401'
        '406':
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeaderErrorResponse'
              examples:
                Not acceptable:
                  $ref: '#/components/examples/406'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unsupported media type:
                  $ref: '#/components/examples/415'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Internal server error:
                  $ref: '#/components/examples/500'
      x-orderingPosition: '3'
components:
  schemas:
    PaymentsSettleRequest: {}
    PaymentsActionPartialRefund:
      type: object
      description: >-
        Partially refund the payment. See
        [details](/products/payments/openapi/manage-payments/partialrefund)
      properties:
        href:
          type: string
        method:
          type: string
          default: POST
    PaymentsActionRefund:
      type: object
      description: >-
        Fully refund the payment. See
        [details](/products/payments/openapi/manage-payments/refund)
      properties:
        href:
          type: string
        method:
          type: string
          default: POST
    PaymentsActionReverse:
      type: object
      description: >-
        Reverse the payment. See
        [details](/products/payments/openapi/manage-payments/reversal)
      properties:
        href:
          type: string
        method:
          type: string
          default: POST
    SettleActionList:
      type: object
      properties:
        refundPayment:
          $ref: '#/components/schemas/PaymentsActionRefund'
        partiallyRefundPayment:
          $ref: '#/components/schemas/PaymentsActionPartialRefund'
        reversePayment:
          $ref: '#/components/schemas/PaymentsActionReverse'
    SettleResponse:
      properties:
        outcome:
          type: string
          enum:
            - sentForSettlement
        paymentId:
          type: string
        _links:
          $ref: '#/components/schemas/PaymentsLink'
        _actions:
          $ref: '#/components/schemas/SettleActionList'
    ErrorResponse:
      type: object
      properties:
        errorName:
          type: string
        message:
          type: string
    HeaderErrorResponse:
      type: object
      properties:
        errorName:
          type: string
        message:
          type: string
        headerName:
          type: string
    PaymentsReversalRequest: {}
    ReversalResponse:
      properties:
        outcome:
          type: string
          enum:
            - sentForReversal
        _links:
          $ref: '#/components/schemas/PaymentsLink'
    ValidationErrorResponse:
      type: object
      properties:
        errorName:
          type: string
        message:
          type: string
        jsonPath:
          type: string
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RefundResponse:
      properties:
        outcome:
          type: string
          enum:
            - sentForRefund
        paymentId:
          type: string
        _links:
          $ref: '#/components/schemas/PaymentsLink'
    PaymentsPartialSettleRequest:
      type: object
      properties:
        reference:
          type: string
          minLength: 1
        sequence:
          $ref: '#/components/schemas/PaymentsSequence'
        value:
          $ref: '#/components/schemas/Value'
      required:
        - reference
        - value
    PaymentsSequence:
      type: object
      description: >-
        The sequence number and total number of expected partial settlement
        requests for the payment.
      properties:
        number:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      required:
        - number
        - total
    Value:
      type: object
      description: The value and currency.
      properties:
        currency:
          type: string
          description: ' The three character currency code. See list of <a href="/products/reference/supported-countries-currencies#iso-currency-codes">supported currencies</a> '
          example: USD
          minLength: 1
        amount:
          type: integer
          format: int32
          description: >-
            The payment amount. Implied decimal. For example, 250 GBP = £2.50

            When set to `0` will perform a card verification instead of a
            payment as part of a new `customerAgreement`.
          example: 250
        acceptPartialAmount:
          type: boolean
          description: >-
            Set to `true` to accept a partial authorization amount. You can
            charge the remainder of the amount using a different payment
            credential with a new authorization request.
      required:
        - amount
        - currency
    PartialSettleActionList:
      type: object
      properties:
        refundPayment:
          $ref: '#/components/schemas/PaymentsActionRefund'
        partiallyRefundPayment:
          $ref: '#/components/schemas/PaymentsActionPartialRefund'
        partiallySettlePayment:
          $ref: '#/components/schemas/PaymentsActionPartialSettle'
        cancelPayment:
          $ref: '#/components/schemas/PaymentsActionCancel'
        reversePayment:
          $ref: '#/components/schemas/PaymentsActionReverse'
    PartialSettleResponse:
      properties:
        outcome:
          type: string
          enum:
            - sentForSettlement
        paymentId:
          type: string
        _links:
          $ref: '#/components/schemas/PaymentsLink'
        _actions:
          $ref: '#/components/schemas/PartialSettleActionList'
    PaymentsActionCancel:
      type: object
      description: >-
        Cancel the payment. See
        [details](/products/payments/openapi/manage-payments/cancel)
      properties:
        href:
          type: string
        method:
          type: string
          default: POST
    PaymentsActionPartialSettle:
      type: object
      description: >-
        Partially settle the payment. See
        [details](/products/payments/openapi/manage-payments/partialsettle)
        including what to add in the request body.
      properties:
        href:
          type: string
        method:
          type: string
          default: POST
    PaymentsPartialRefundRequest:
      type: object
      properties:
        reference:
          type: string
          minLength: 1
        value:
          $ref: '#/components/schemas/Value'
      required:
        - reference
        - value
    PartialRefundActionList:
      type: object
      properties:
        partiallyRefundPayment:
          $ref: '#/components/schemas/PaymentsActionPartialRefund'
    PartialRefundResponse:
      properties:
        outcome:
          type: string
          enum:
            - sentForPartialRefund
        paymentId:
          type: string
        _links:
          $ref: '#/components/schemas/PaymentsLink'
        _actions:
          $ref: '#/components/schemas/PartialRefundActionList'
    CancelResponse:
      properties:
        outcome:
          type: string
          enum:
            - sentForCancellation
        _links:
          $ref: '#/components/schemas/PaymentsLink'
    DeviceDataRequest:
      type: object
      properties:
        collectionReference:
          type: string
          description: >-
            Add the `sessionId` provided in the [postMessage for the device data
            collection form
            (web)](/products/payments/enable-features/3ds-authentication/web) or
            for native (iOS/Android), returned as `consumerSessionId` as part of
            [SDK
            initialization](/products/payments/enable-features/3ds-authentication/android-ios).
            <br><br>__Note:__ If device data collection fails you can attempt
            the payment without this value, but you will see an increased number
            of `challenged` and even `authenticationFailed` outcomes, if this
            happens for a lot of requests.
    Advice:
      type: object
      properties:
        code:
          type: string
    Amounts:
      type: object
      description: >-
        An object containing transaction amounts. Returned for partial
        authorizations.
      properties:
        requested:
          type: integer
          format: int32
          description: The requested amount.
          example: 1000
        totalAuthorized:
          type: integer
          format: int32
          description: The total amount authorized by the card issuer.
          example: 700
        currency:
          type: string
          description: >-
            The three character currency code. See list of <a
            href="/products/reference/supported-countries-currencies#iso-currency-codes">supported
            currencies</a>.
          example: GBP
        partialAuthorization:
          type: boolean
          description: >-
            Indicates that the authorized amount is less than what you have
            requested.
    Authentication:
      type: object
      properties:
        version:
          type: string
          description: The version of 3DS used to process the transaction.
          example: 2.2.0
          maxLength: 10
          minLength: 1
        type:
          type: string
        authenticationValue:
          type: string
        eci:
          type: string
          description: >-
            Electronic Commerce Indicator (ECI). Indicates the outcome of the
            3DS authentication.
          maxLength: 2
          minLength: 1
        transactionId:
          type: string
          description: A transaction identifier.
          maxLength: 64
          minLength: 1
        cryptogramAlgorithm:
          type: string
        challengePreference:
          type: string
        authenticationFlow:
          type: string
        networkScore:
          type: string
        brand:
          type: string
    AuthenticationUnavailable:
      type: object
      properties:
        version:
          type: string
          description: The version of 3DS used to process the transaction.
          example: 2.2.0
          maxLength: 10
          minLength: 1
        eci:
          type: string
          description: >-
            Electronic Commerce Indicator (ECI). Indicates the outcome of the
            3DS authentication.
          maxLength: 2
          minLength: 1
    AuthorizationActionList:
      type: object
      properties:
        cancelPayment:
          $ref: '#/components/schemas/PaymentsActionCancel'
        settlePayment:
          $ref: '#/components/schemas/PaymentsActionSettle'
        partiallySettlePayment:
          $ref: '#/components/schemas/PaymentsActionPartialSettle'
        reversePayment:
          $ref: '#/components/schemas/PaymentsActionReverse'
    CardAuthorizedPaymentResponse:
      properties:
        outcome:
          type: string
        paymentId:
          type: string
          description: >-
            Unique identifier generated by us for a single payment. Generated at
            authorization, and maintained through successive payment actions.
          pattern: ^[A-Za-z0-9_-]+$
        transactionReference:
          type: string
          description: ' A unique reference generated by you that is used to identify a payment throughout its lifecycle. '
          maxLength: 64
          minLength: 1
          pattern: ^[-A-Za-z0-9_!@#$%()*=.:;?\[\]{}~`/+]*$
        paymentInstrument:
          $ref: '#/components/schemas/PaymentsResponsePaymentInstrument'
        updatedPaymentInstrument:
          $ref: '#/components/schemas/PaymentsUpdatedPaymentInstrument'
        issuer:
          $ref: '#/components/schemas/Issuer'
        riskFactors:
          type: array
          description: ' Any risk factors which have been identified for the authorization. This section will not appear if no risks are identified. '
          items:
            $ref: '#/components/schemas/RiskFactor'
        fraud:
