        - value
    PaymentsInstallmentCustomerAgreement:
      allOf:
        - $ref: '#/components/schemas/PaymentsCustomerAgreement'
        - type: object
          properties:
            type:
              type: string
              enum:
                - installment
            storedCardUsage:
              type: string
              description: ' Set to `first` to store a card or `subsequent` to use a previously stored card. Mandatory for `merchant` installment type. '
              enum:
                - first
                - subsequent
            installmentType:
              type: string
              description: >2-
                 Defines the type of installments service. 

                Read more on how to set up [__Latin America
                Installments__](/products/payments/enable-features/latam-installments)
                under our guide.
              enum:
