    PaymentsEncryptedPaymentInstrument:
      allOf:
        - $ref: '#/components/schemas/PaymentsPaymentInstrument'
        - type: object
          properties:
            type:
              type: string
              description: The type of instrument.
              enum:
                - encrypted
            walletToken:
              type: string
              minLength: 1
            billingAddress:
              $ref: '#/components/schemas/PaymentsBillingAddress'
      required:
        - type
        - walletToken
    PaymentsExemptionRequest:
      type: object
      properties:
        placement:
          type: string
          default: optimized
          description: Defines where the exemption is being requested.
          enum:
            - optimized
            - authorization
            - authentication
          x-enumDescriptions:
            authorization: A request for an exemption placed within the authorization.
            optimized: We select the best performing placement based on its data.
            authentication: A request for an exemption placed within the authentication (3DS).
        type:
          type: string
          default: optimized
          description: Defines which type of exemption is being requested.
          enum:
            - optimized
            - lowValue
            - lowRisk
          x-enumDescriptions:
            lowValue: An exemption for an authorization that is under €30.
            optimized: We select the best performing type based on its data.
            lowRisk: >-
              An exemption for an authorization that has been through
              Transaction Risk Analysis (TRA).
    PaymentsExternalThreeDS:
      allOf:
        - $ref: '#/components/schemas/PaymentsThreeDS'
        - type: object
          properties:
            type:
              type: string
              description: ThreeDS type.
              enum:
                - external
            version:
              type: string
              description: 3DS version used to process the transaction.
              example: 2.2.0
              maxLength: 5
              minLength: 5
              pattern: ^2[.][0-9][.][0-9]$
            eci:
              type: string
              description: |2
                          Electronic Commerce Indicator (ECI). Required for all card brands except Cartes Bancaires.

                          | ECI | Meaning | 
                          |---|---| 
                          | 02 or 05 | Fully authenticated transaction | 
                          | 01 or 06 | Attempted authentication transaction | 
                          | 00 or 07 | Non 3-D Secure transaction | 

                          | Scheme | Value | 
                          |---|---| 
                          |  Mastercard | 02, 01, 00 |
                          |  Visa | 05, 06, 07 |
                          | Amex | 05, 06, 07 | 
                          | JCB | 05, 06, 07 |
                          |  Diners | 05, 06, 07 |
              enum:
                - '00'
                - '01'
                - '02'
                - '05'
                - '06'
                - '07'
            authenticationValue:
              type: string
              description: >-
                Required if `eci` value is 01, 02, 05 or 06. A cryptographic
                value that provides evidence of the outcome of a 3DS
                verification.
              example: kBNHXUAy4+HT1gAMBSDajheBcxQh
              maxLength: 29
              minLength: 1
              pattern: ^[a-zA-Z0-9+/]+={0,2}$
            dsTransactionId:
              type: string
              format: RFC 4122 UUID
              description: >-
                Required if 'eci' value is 01, 02, 05 or 06. A unique
                authentication transaction identifier, generated by the issuer.
              example: b8fb4ecc-7e2e-4b1c-816d-0149849776b8
            cryptogramAlgorithm:
              type: string
              description: >-
                Indicates the algorithm used to generate the cryptogram. For
                Cartes Bancaires authorizations only.
              example: '2'
              maxLength: 1
              minLength: 1
              pattern: ^[a-zA-Z0-9]$
            challengePreference:
              type: string
              description: >-
                Indicates the preferred challenge behavior. For Cartes Bancaires
                authorizations only.
              enum:
                - noPreference
                - noChallengeRequested
                - challengeRequested
                - challengeMandated
                - noChallengeRequestedTRAPerformed
            authenticationFlow:
              type: string
              description: >
                Set to challenge if your customer was redirected to their bank
                to complete authentication, or frictionless if your customer
                completed authentication without needing to be redirected to
                their bank. For Cartes Bancaires authorizations only.
              enum:
                - challenge
                - frictionless
                - frictionlessDelegated
            networkScore:
              type: string
              description: >-
                The global score calculated by the Cartes Bancaires scoring
                platform. For Cartes Bancaires authorizations only.
              maxLength: 2
              minLength: 1
              pattern: ^[0-9]+$
            brand:
              type: string
              description: >-
                The card brand used in the authentication. For Cartes Bancaires
                authorizations only.
              enum:
                - cartesBancaires
      description: >-
        An object containing 3DS authentication preferences.


        Read more on how to set it up under our [__3DS
        Authentication__](/products/payments/enable-features/3ds-authentication)
        guide.
      required:
        - type
        - version
    PaymentsFraud:
      type: object
      description: >-
        Fraud assessment to detect potential fraud and prevent the transaction
        from proceeding.


        Read more on how to set it up under our [__Fraud
        Assessment__](/products/payments/enable-features/fraud-assessment)
        guide.
      properties:
        type:
          type: string
          default: fraudSight
          description: Enable a FraudSight risk assessment
          enum:
            - fraudSight
        silentMode:
          type: boolean
          default: false
          description: |-
            Perform the Fraud assessment but do not act on the outcome.
                        Normally used for the initial launch while the data model is maturing.
        tmxSessionId:
          type: string
          description: Device fingerprint provided by Threatmetrix.
          maxLength: 128
          minLength: 30
          pattern: ^[A-Za-z0-9_-]*$
        custom:
          $ref: '#/components/schemas/Custom'
          description: >-
            Additional values specific to your order that can be used to create
            manual fraud rules.
      required:
        - type
    PaymentsFundsRecipient:
      description: >-
        An object containing details about the recipient of funds, including
        name and address information, as well as recipient account details. In
        many use cases, the recipient is the same person as the sender (for
        example if your customer uses their card to load funds into their own
        crypto exchange or investment account). __Although an optional object in
        the API schema, `recipient` is required for some regions and use
        cases.__
      properties:
        account:
          $ref: '#/components/schemas/PaymentsRecipientAccount'
        firstName:
          type: string
          description: Recipient's first name.
          maxLength: 22
          minLength: 1
          pattern: ^(?!\s*$).*$
        middleName:
          type: string
          description: Recipient's middle name.
          maxLength: 22
          minLength: 1
          pattern: ^(?!\s*$).*$
        lastName:
          type: string
          description: Recipient's last name.
          maxLength: 22
          minLength: 1
          pattern: ^(?!\s*$).*$
        address:
          $ref: '#/components/schemas/PaymentsTransferAddress'
        dateOfBirth:
          type: string
          format: date
          description: Recipient's date of birth
        phoneNumber:
          type: string
          description: Recipient's phone number
          maxLength: 20
          minLength: 4
          pattern: ^(?!\s*$)[0-9\s()+\-/.x]*$
        documentReference:
          type: string
          description: Required for domestic processing in some Latin American countries.
          maxLength: 25
          minLength: 1
          pattern: ^[-A-Za-z0-9_\-/\\*~+.,&()]*$
    PaymentsFundsSender:
      type: object
      description: >-
        An object containing details about the sender of funds, including name
        and address information. The sender account is always the card account
        declared within `instruction.paymentInstrument`. __Although an optional
        object in the API schema, `sender` is required for some regions and use
        cases.__
      properties:
        firstName:
          type: string
          description: >-
            Sender's first name. Must be supplied if `lastName` or `middleName`
            are provided.
          maxLength: 22
          minLength: 1
          pattern: ^(?!\s*$).*$
        middleName:
          type: string
          description: Sender's middle name.
          maxLength: 22
          minLength: 1
          pattern: ^(?!\s*$).*$
        lastName:
          type: string
          description: >-
            Sender's last name. Must be supplied if `firstName` or `middleName`
            are provided.
          maxLength: 22
          minLength: 1
          pattern: ^(?!\s*$).*$
        address:
          $ref: '#/components/schemas/PaymentsTransferAddress'
          description: Sender's address.
        dateOfBirth:
          type: string
          format: date
          description: Sender's date of birth
        documentReference:
          type: string
          description: >-
            Sender's document reference (e.g. Tax ID). Required for domestic
            processing in some Latin American countries.
          maxLength: 25
          minLength: 1
          pattern: ^[-A-Za-z0-9_\-/\\*~+.,&()]*$
    PaymentsFundsTransfer:
      type: object
      description: >-
        Contains details of the funds transfer request, which is a money
        movement for a reason other than the purchase of goods or services (also
        known as Account Funding Transaction (AFT)).


        Read more on how to set it up under our [__Account Funding
        Transactions__](/products/payments/enable-features/account-funding-transactions)
        guide.
      properties:
        type:
          type: string
          description: >-
            Specifies the type of the funds transfer. {% admonition
            type="warning" name="Note" %} You may only submit the
            `fundsTransfer.type` values that relate to the use cases that you
            have been approved for by the schemes.{% /admonition %}
          enum:
            - accountToAccount
            - cash
            - disbursement
            - personToPerson
            - purchase
            - topUp
            - walletLoad
          x-enumDescriptions:
            disbursement: A card is used as the source of funds for a disbursement
            personToPerson: Move funds to an account owned by another person (eg gifts)
            accountToAccount: >-
              Move funds to another financial institution account owned by the
              same person
            topUp: Top up a pre-paid or debit card
            purchase: >-
              For the initial purchase of a reloadable account (such as prepaid
              or gift card), or direct crypto & liquid asset purchases without
              an intermediary wallet load
            cash: >-
              A card is used to fund a transfer where funds are given to the
              recipient in cash
            walletLoad: Move funds to a digital wallet owned by the same person
        purpose:
          type: string
          description: >-
            Specifies the purpose of the funds transfer. Required for some
            regions and use cases (eg crypto).
          enum:
            - businessToBusiness
            - creditCardRepayment
            - crypto
            - crowdLending
            - debitCard
            - education
            - emergency
            - familySupport
            - gift
            - giftCard
            - gaming
            - highRiskSecurities
            - liquidAssets
            - medical
            - payroll
            - prepaidCard
            - salary
            - savings
            - travel
            - other
        recipient:
          $ref: '#/components/schemas/PaymentsFundsRecipient'
        sender:
          $ref: '#/components/schemas/PaymentsFundsSender'
      required:
        - type
    PaymentsGiftCardsPurchase:
